name: Apply Oma source patches

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-oma-patches-main
  cancel-in-progress: false

jobs:
  apply-patches:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply and validate the prepared patches
        shell: bash
        run: |
          set -euo pipefail
          output="$(python3 apply_patches.py 2>&1)"
          printf '%s\n' "$output"
          if ! grep -Eq 'problems 0$' <<< "$output"; then
            echo "Patch application reported one or more problems; refusing to commit."
            exit 1
          fi

      - name: Commit applied source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/__init__.py app/models.py scripts/repair_runtime_schema.py app/api.py mobile/lib/full_features.dart
          if git diff --cached --quiet; then
            echo "No source changes to commit; patches were already applied."
            exit 0
          fi
          git commit -m "Apply receipt and Instagram settings patches"
          git push origin HEAD:main
