name: Stage 3 Architecture Guard

on:
  push:
    branches:
      - main
      - stage3-architecture
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install backend dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -q -r requirements.txt -r requirements-dev.txt

      - name: Compile backend
        run: |
          python3 -m compileall -q app migrations run.py

      - name: Run backend tests
        run: python3 -m pytest -q

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze

      - name: Test Flutter architecture
        working-directory: mobile
        run: flutter test test/architecture_layers_test.dart
