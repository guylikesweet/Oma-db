name: Stage 7 Performance Guard

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "migrations/**"
      - "mobile/**"
      - ".github/workflows/stage7-performance.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "migrations/**"
      - "mobile/**"
      - ".github/workflows/stage7-performance.yml"
  workflow_dispatch:

jobs:
  performance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile backend and migrations
        run: |
          python -m compileall -q app migrations
          python -m py_compile migrations/versions/oma20261006_performance.py

      - name: Run backend tests
        run: pytest -q

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze

      - name: Run architecture tests
        working-directory: mobile
        run: flutter test test/architecture_layers_test.dart

      - name: Build Flutter Web
        working-directory: mobile
        run: flutter build web --release --dart-define=API_BASE_URL=https://oma-db.onrender.com/api
