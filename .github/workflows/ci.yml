name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "migrations/**"
      - "mobile/**"
      - "tests/**"
      - "config.py"
      - "run.py"
      - "render.yaml"
      - "requirements*.txt"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "migrations/**"
      - "mobile/**"
      - "tests/**"
      - "config.py"
      - "run.py"
      - "render.yaml"
      - "requirements*.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oma-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      SECRET_KEY: oma-ci-secret
      DATABASE_URL: sqlite:////tmp/oma-ci.db
      ADMIN_USERNAME: oma-ci-admin
      ADMIN_PASSWORD: oma-ci-password
      OMA_PUBLIC_BASE_URL: https://oma-ci.example
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt -r requirements-dev.txt

      - name: Compile backend and migrations
        run: python -m compileall -q app migrations run.py config.py

      - name: Run backend tests
        run: python -m pytest -q

      - name: Verify migration graph
        run: |
          heads=$(flask --app run.py db heads | grep -c '(head)' || true)
          if [ "$heads" -ne 1 ]; then
            echo "Expected exactly one Alembic head, found $heads"
            flask --app run.py db heads
            exit 1
          fi
          flask --app run.py db heads

      - name: Verify application factory and health route
        run: |
          python - <<'PY'
          from app import create_app

          app = create_app()
          assert app.url_map.bind("").match("/healthz")[0] == "healthz"

          with app.test_client() as client:
              response = client.get("/healthz")
              assert response.status_code == 200, response.get_json()
              assert response.get_json()["database"] == "ok"
              request_id = response.headers.get("X-Request-ID")
              assert request_id and len(request_id) <= 128

          print("Application factory, database health check, and request correlation passed.")

      - name: Verify private staff entrypoint and API error behavior
        run: |
          python - <<'PY'
          from app import create_app

          app = create_app()
          with app.test_client() as client:
              home = client.get("/", follow_redirects=False)
              assert home.status_code == 302
              assert home.headers["Location"].endswith("/webapp/")

              classic = client.get("/classic", follow_redirects=False)
              assert classic.status_code == 301
              assert classic.headers["Location"].endswith("/webapp/")

              legacy_login = client.get("/login", follow_redirects=False)
              assert legacy_login.status_code == 404

              robots = client.get("/robots.txt")
              assert robots.status_code == 200
              assert robots.get_data(as_text=True).strip() == "User-agent: *\nDisallow: /"

              api_missing = client.get("/api/v1/does-not-exist")
              assert api_missing.status_code == 404
              assert api_missing.is_json
              assert api_missing.get_json()["request_id"]

              api_wrong_method = client.get("/api/v1/auth/login")
              assert api_wrong_method.status_code == 405
              assert api_wrong_method.is_json
              assert api_wrong_method.get_json()["request_id"]

          print("Flutter Web root, classic-retirement redirects, robots policy, API 404/405 behavior, and request IDs passed.")
          PY

      - name: Verify production SECRET_KEY fail-closed behavior
        env:
          DATABASE_URL: postgresql://security-test.invalid/db
        run: |
          python - <<'PY'
          import os
          os.environ.pop("SECRET_KEY", None)
          os.environ["DATABASE_URL"] = "postgresql://security-test.invalid/db"
          try:
              import config
              raise SystemExit("Config accepted production DATABASE_URL without SECRET_KEY")
          except RuntimeError as exc:
              if "SECRET_KEY" not in str(exc):
                  raise
          print("Production SECRET_KEY fail-closed guard verified.")
          PY

  mobile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true

      - name: Install pinned Android native build tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: mobile
        # Flutter 3.47 reports legacy deprecations as infos. Keep CI strict on
        # warnings/errors without failing solely on non-blocking migration notices.
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Run architecture tests
        working-directory: mobile
        run: flutter test test/architecture_layers_test.dart

      - name: Run synchronization reliability tests
        working-directory: mobile
        run: flutter test test/sync_reliability_test.dart

      - name: Prepare non-production Firebase config for Android compile test
        working-directory: mobile
        shell: bash
        run: |
          mkdir -p android/app
          # The Gradle script configures a release signing block even for debug
          # builds. Dummy values satisfy configuration only; this CI job never
          # signs or publishes a release APK.
          cat > android/key.properties <<'PROPS'
          keyAlias=ci-only
          keyPassword=ci-only
          storeFile=ci-only.jks
          storePassword=ci-only
          PROPS
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "oma-ci-build",
              "storage_bucket": "oma-ci-build.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:0000000000000000",
                "android_client_info": { "package_name": "com.omagroup.salesapp" }
              },
              "api_key": [{ "current_key": "ci-build-only-not-a-secret" }]
            }],
            "configuration_version": "1"
          }
          JSON

      - name: Build Android 8+ ARM64 debug APK
        working-directory: mobile
        run: flutter build apk --debug --target-platform android-arm64 --dart-define=API_BASE_URL=https://oma-db.onrender.com/api

      - name: Verify Android APK platform contract
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "sdkVersion:'26'"
          "$AAPT" dump badging "$APK" | grep -F "targetSdkVersion:'36'"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.omagroup.salesapp'"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libllama_jni.so"
          unzip -l "$APK" | grep -F "res/mipmap-anydpi-v26/ic_launcher.xml"

      - name: Build Flutter Web
        working-directory: mobile
        run: flutter build web --release --dart-define=API_BASE_URL=https://oma-db.onrender.com/api
