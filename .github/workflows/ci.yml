name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "migrations/**"
      - "mobile/**"
      - "tests/**"
      - "config.py"
      - "run.py"
      - "render.yaml"
      - "requirements*.txt"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "migrations/**"
      - "mobile/**"
      - "tests/**"
      - "config.py"
      - "run.py"
      - "render.yaml"
      - "requirements*.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      SECRET_KEY: oma-ci-secret
      DATABASE_URL: sqlite:////tmp/oma-ci.db
      ADMIN_USERNAME: oma-ci-admin
      ADMIN_PASSWORD: oma-ci-password
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt -r requirements-dev.txt

      - name: Compile backend and migrations
        run: python -m compileall -q app migrations run.py config.py

      - name: Run backend tests
        run: python -m pytest -q

      - name: Verify migration graph
        run: |
          heads=$(flask --app run.py db heads | grep -c '(head)' || true)
          if [ "$heads" -ne 1 ]; then
            echo "Expected exactly one Alembic head, found $heads"
            flask --app run.py db heads
            exit 1
          fi
          flask --app run.py db heads

      - name: Verify application factory and health route
        run: |
          python - <<'PY'
          from app import create_app

          app = create_app()
          assert app.url_map.bind("").match("/healthz")[0] == "healthz"

          with app.test_client() as client:
              response = client.get("/healthz")
              assert response.status_code == 200, response.get_json()
              assert response.get_json()["database"] == "ok"
              request_id = response.headers.get("X-Request-ID")
              assert request_id and len(request_id) <= 128

          print("Application factory, database health check, and request correlation passed.")

      - name: Verify public marketing routes
        run: |
          python - <<'PY'
          from app import create_app

          app = create_app()
          with app.test_client() as client:
              home = client.get("/")
              assert home.status_code == 200
              assert b"application/ld+json" in home.data
              assert b'property="og:image"' in home.data
              assert b'href="/"' in home.data

              use_case = client.get("/use-case/gadgets-electronics")
              assert use_case.status_code == 200
              assert b"Gadgets &amp; Electronics" in use_case.data or b"Gadgets & Electronics" in use_case.data

              missing = client.get("/use-case/not-a-real-business")
              assert missing.status_code == 404

              robots = client.get("/robots.txt")
              body = robots.get_data(as_text=True)
              assert robots.status_code == 200
              assert "Sitemap:" in body
              assert "\\n" not in body
              assert "Disallow: /api/" in body

              sitemap = client.get("/sitemap.xml")
              assert sitemap.status_code == 200
              assert "<urlset" in sitemap.get_data(as_text=True)
              assert "/use-case/gadgets-electronics" in sitemap.get_data(as_text=True)

              for path in ("/", "/use-case/gadgets-electronics", "/robots.txt", "/sitemap.xml"):
                  response = client.get(path)
                  assert response.headers.get("X-Content-Type-Options") == "nosniff"
                  assert response.headers.get("Referrer-Policy") == "strict-origin-when-cross-origin"

          print("Public marketing routes, SEO endpoints, headers, and 404 behavior passed.")
          PY
          PY

      - name: Verify production SECRET_KEY fail-closed behavior
        env:
          DATABASE_URL: postgresql://security-test.invalid/db
        run: |
          python - <<'PY'
          import os
          os.environ.pop("SECRET_KEY", None)
          os.environ["DATABASE_URL"] = "postgresql://security-test.invalid/db"
          try:
              import config
              raise SystemExit("Config accepted production DATABASE_URL without SECRET_KEY")
          except RuntimeError as exc:
              if "SECRET_KEY" not in str(exc):
                  raise
          print("Production SECRET_KEY fail-closed guard verified.")
          PY

  mobile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Run architecture tests
        working-directory: mobile
        run: flutter test test/architecture_layers_test.dart

      - name: Run synchronization reliability tests
        working-directory: mobile
        run: flutter test test/sync_reliability_test.dart

      - name: Build Flutter Web
        working-directory: mobile
        run: flutter build web --release --dart-define=API_BASE_URL=https://oma-db.onrender.com/api
