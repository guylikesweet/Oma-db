name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "migrations/**"
      - "mobile/**"
      - "tests/**"
      - "config.py"
      - "run.py"
      - "render.yaml"
      - "requirements*.txt"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "migrations/**"
      - "mobile/**"
      - "tests/**"
      - "config.py"
      - "run.py"
      - "render.yaml"
      - "requirements*.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      SECRET_KEY: oma-ci-secret
      DATABASE_URL: sqlite:////tmp/oma-ci.db
      ADMIN_USERNAME: oma-ci-admin
      ADMIN_PASSWORD: oma-ci-password
      OMA_PUBLIC_BASE_URL: https://oma-ci.example
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --disable-pip-version-check -q -r requirements.txt -r requirements-dev.txt

      - name: Compile backend and migrations
        run: python -m compileall -q app migrations run.py config.py

      - name: Run backend tests
        run: python -m pytest -q

      - name: Verify migration graph
        run: |
          heads=$(flask --app run.py db heads | grep -c '(head)' || true)
          if [ "$heads" -ne 1 ]; then
            echo "Expected exactly one Alembic head, found $heads"
            flask --app run.py db heads
            exit 1
          fi
          flask --app run.py db heads

      - name: Verify application factory and health route
        run: |
          python - <<'PY'
          from app import create_app

          app = create_app()
          assert app.url_map.bind("").match("/healthz")[0] == "healthz"

          with app.test_client() as client:
              response = client.get("/healthz")
              assert response.status_code == 200, response.get_json()
              assert response.get_json()["database"] == "ok"
              request_id = response.headers.get("X-Request-ID")
              assert request_id and len(request_id) <= 128

          print("Application factory, database health check, and request correlation passed.")

      - name: Verify private staff entrypoint and API error behavior
        run: |
          python - <<'PY'
          from app import create_app

          app = create_app()
          with app.test_client() as client:
              home = client.get("/", follow_redirects=False)
              assert home.status_code == 302
              assert home.headers["Location"].endswith("/classic")

              robots = client.get("/robots.txt")
              assert robots.status_code == 200
              assert robots.get_data(as_text=True) == "User-agent: *\\nDisallow: /\\n"

              api_missing = client.get("/api/v1/does-not-exist")
              assert api_missing.status_code == 404
              assert api_missing.is_json
              assert api_missing.get_json()["request_id"]

              api_wrong_method = client.get("/api/v1/auth/login")
              assert api_wrong_method.status_code == 405
              assert api_wrong_method.is_json
              assert api_wrong_method.get_json()["request_id"]

          print("Private staff entrypoint, robots policy, API 404/405 behavior, and request IDs passed.")
          PY

      - name: Verify production SECRET_KEY fail-closed behavior
        env:
          DATABASE_URL: postgresql://security-test.invalid/db
        run: |
          python - <<'PY'
          import os
          os.environ.pop("SECRET_KEY", None)
          os.environ["DATABASE_URL"] = "postgresql://security-test.invalid/db"
          try:
              import config
              raise SystemExit("Config accepted production DATABASE_URL without SECRET_KEY")
          except RuntimeError as exc:
              if "SECRET_KEY" not in str(exc):
                  raise
          print("Production SECRET_KEY fail-closed guard verified.")
          PY

  mobile:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Run architecture tests
        working-directory: mobile
        run: flutter test test/architecture_layers_test.dart

      - name: Run synchronization reliability tests
        working-directory: mobile
        run: flutter test test/sync_reliability_test.dart

      - name: Build Flutter Web
        working-directory: mobile
        run: flutter build web --release --dart-define=API_BASE_URL=https://oma-db.onrender.com/api
