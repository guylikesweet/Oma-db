name: Resolve and commit Flutter dependency lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oma-flutter-lock-main
  cancel-in-progress: false

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Resolve and validate dependencies
        run: |
          set -euo pipefail
          flutter pub get
          test -s pubspec.lock
          flutter pub get --enforce-lockfile

      - name: Commit lockfile to main
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/pubspec.lock
          if git diff --cached --quiet; then
            echo "Flutter dependency lockfile is already current."
            exit 0
          fi
          git commit -m "chore: lock Flutter mobile dependencies"
          git push origin HEAD:main
