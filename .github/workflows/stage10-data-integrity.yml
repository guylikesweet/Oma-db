name: Stage 10 Data Integrity Guard

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "migrations/**"
      - "config.py"
      - "tests/**"
      - "mobile/**"
      - ".github/workflows/stage10-data-integrity.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "migrations/**"
      - "config.py"
      - "tests/**"
      - "mobile/**"
      - ".github/workflows/stage10-data-integrity.yml"
  workflow_dispatch:

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile backend and migrations
        run: python -m compileall -q app migrations run.py

      - name: Run backend tests
        run: pytest -q

      - name: Verify migration graph has one head
        env:
          SECRET_KEY: stage10-ci-secret
          DATABASE_URL: sqlite:////tmp/oma-stage10.db
          ADMIN_USERNAME: stage10-admin
          ADMIN_PASSWORD: stage10-password
        run: |
          heads=$(flask --app run.py db heads | grep -c '(head)' || true)
          if [ "$heads" -ne 1 ]; then
            echo "Expected exactly one Alembic head, found $heads"
            flask --app run.py db heads
            exit 1
          fi
          flask --app run.py db heads

      - name: Verify application factory
        env:
          SECRET_KEY: stage10-ci-secret
          DATABASE_URL: sqlite:////tmp/oma-stage10.db
          ADMIN_USERNAME: stage10-admin
          ADMIN_PASSWORD: stage10-password
        run: |
          python - <<'PY'
          from app import create_app
          app = create_app()
          with app.app_context():
              assert app.extensions["migrate"] is not None
          print("Application factory and migration extension initialized.")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze

      - name: Run architecture tests
        working-directory: mobile
        run: flutter test test/architecture_layers_test.dart

      - name: Build Flutter Web
        working-directory: mobile
        run: flutter build web --release --dart-define=API_BASE_URL=https://oma-db.onrender.com/api
