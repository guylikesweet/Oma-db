name: Stage 9 Runtime Reliability Guard

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "run.py"
      - "config.py"
      - "render.yaml"
      - "tests/**"
      - ".github/workflows/stage9-runtime.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "run.py"
      - "config.py"
      - "render.yaml"
      - "tests/**"
      - ".github/workflows/stage9-runtime.yml"
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile backend
        run: python -m compileall -q app run.py

      - name: Run backend tests
        run: pytest -q

      - name: Verify application imports
        env:
          SECRET_KEY: stage9-ci-secret
          DATABASE_URL: sqlite:///:memory:
          ADMIN_USERNAME: stage9-admin
          ADMIN_PASSWORD: stage9-password
        run: |
          python - <<'PY'
          from app import create_app
          app = create_app()
          assert app.url_map.bind("").match("/healthz")[0] == "healthz"
          print("Application factory/import check passed.")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze

      - name: Run architecture tests
        working-directory: mobile
        run: flutter test test/architecture_layers_test.dart

      - name: Build Flutter Web
        working-directory: mobile
        run: flutter build web --release --dart-define=API_BASE_URL=https://oma-db.onrender.com/api
