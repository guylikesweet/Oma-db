name: Build APK
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend URL'
        required: true
        default: 'https://oma-db.onrender.com/api'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.0'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow
      - run: flutter pub get
      - name: Create android and fix everything
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi
          # Fix MainActivity v2 embedding
          rm -rf android/app/src/main/java/io
          mkdir -p android/app/src/main/kotlin/com/example/oma_mobile
          echo 'package com.example.oma_mobile
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity: FlutterActivity()' > android/app/src/main/kotlin/com/example/oma_mobile/MainActivity.kt
          find android/app/src/main -name "MainActivity.java" -delete || true
          # FIX 1: App Name
          sed -i 's/android:label=".*"/android:label="OmaSales Mobile"/' android/app/src/main/AndroidManifest.xml
          # FIX 2: INTERNET PERMISSION - THIS IS WHY HOST LOOKUP FAILS
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <application/' android/app/src/main/AndroidManifest.xml
          fi
          cat android/app/src/main/AndroidManifest.xml
          # Fix inner text Oma Mobile
          sed -i 's/Oma Mobile/OmaSales Mobile/g' lib/main.dart 2>/dev/null || true
          find lib -name "*.dart" -exec sed -i 's/Oma Mobile/OmaSales Mobile/g' {} \; || true
          # Icon
          python3 << 'PY'
          from PIL import Image
          import os
          src="assets/images/app_icon.png"
          if os.path.exists(src):
              im=Image.open(src).convert("RGBA")
              s=max(im.size); bg=Image.new("RGBA",(s,s),(255,255,255,255)); bg.paste(im,((s-im.width)//2,(s-im.height)//2),im)
              for f,p in {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}.items():
                  path=f"android/app/src/main/res/{f}"; os.makedirs(path,exist_ok=True)
                  r=bg.resize((p,p),Image.LANCZOS); r.save(f"{path}/launcher_icon.png","PNG"); r.save(f"{path}/ic_launcher.png","PNG")
          PY
      - name: Configure persistent Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Missing Android release signing secrets."
            echo "Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD before building a production APK."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/oma-release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=oma-release.jks
          EOF
          python3 - <<'PY2'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          marker='android {\n'
          loader="""def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file('key.properties')\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n}\n\n"""
          if 'keystorePropertiesFile' not in s:
              s=s.replace(marker, loader+marker, 1)
          signing="""    signingConfigs {\n        release {\n            keyAlias keystoreProperties['keyAlias']\n            keyPassword keystoreProperties['keyPassword']\n            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null\n            storePassword keystoreProperties['storePassword']\n        }\n    }\n\n"""
          if 'signingConfigs {' not in s:
              s=s.replace(marker, marker+signing, 1)
          s=s.replace('signingConfig = signingConfigs.debug', 'signingConfig = signingConfigs.release')
          s=s.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
          p.write_text(s)
          PY2
      - run: flutter build apk --release --build-number="${{ github.run_number }}" --dart-define=API_BASE_URL="${{ inputs.api_url }}"
      - run: flutter build appbundle --release --build-number="${{ github.run_number }}" --dart-define=API_BASE_URL="${{ inputs.api_url }}"
      - uses: actions/upload-artifact@v4
        with:
          name: OmaSales-Mobile-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OmaSales-Mobile-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
      - name: Remove signing material from runner
        if: always()
        run: rm -f android/oma-release.jks android/key.properties
