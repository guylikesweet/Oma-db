name: Build APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'API URL (e.g. https://your-app.onrender.com/api)'
        required: true
        default: 'https://your-app.onrender.com/api'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.0'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow
          
      - name: Install dependencies
        run: flutter pub get

      - name: Fix API config name
        run: |
          if [ -f lib/core/config.dart ]; then
            sed -i 's/OMA_API_BASE_URL/API_BASE_URL/g' lib/core/config.dart || true
          fi
          if [ -f lib/data/config.dart ]; then
            sed -i 's/OMA_API_BASE_URL/API_BASE_URL/g' lib/data/config.dart || true
          fi
          if [ -f lib/config.dart ]; then
            sed -i 's/OMA_API_BASE_URL/API_BASE_URL/g' lib/config.dart || true
          fi

      - name: Generate launcher icons from Oma logo
        run: |
          ls -lh assets/images/ || echo "no images folder"
          file assets/images/app_icon.png || true
          python3 << 'PY'
          from PIL import Image
          import os

          src = "assets/images/app_icon.png"
          fallback = "assets/images/logo.png"
          img_path = None

          if os.path.exists(src):
              try:
                  Image.open(src).verify()
                  img_path = src
                  print(f"Using {src}")
              except Exception as e:
                  print(f"app_icon.png invalid: {e}")

          if not img_path and os.path.exists(fallback):
              try:
                  Image.open(fallback).verify()
                  img_path = fallback
                  print(f"Falling back to {fallback}")
              except Exception as e:
                  print(f"logo.png also invalid: {e}")

          if not img_path:
              print("Both images invalid - generating fallback icon")
              im = Image.new("RGBA", (512, 512), (255,255,255,255))
              from PIL import ImageDraw
              draw = ImageDraw.Draw(im)
              draw.rounded_rectangle([50,50,462,462], radius=80, fill=(79,70,229))
              try:
                  draw.text((256,256), "Oma", anchor="mm", fill="white", font_size=120)
              except:
                  draw.text((180,220), "Oma", fill="white")
              im.save("assets/images/app_icon.png")
              img_path = "assets/images/app_icon.png"
          else:
              im = Image.open(img_path).convert("RGBA")

          size = max(im.size)
          bg = Image.new("RGBA", (size, size), (255,255,255,255))
          bg.paste(im, ((size-im.width)//2, (size-im.height)//2), im)

          densities = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }
          for folder, px in densities.items():
              path = f"android/app/src/main/res/{folder}"
              os.makedirs(path, exist_ok=True)
              resized = bg.resize((px, px), Image.LANCZOS)
              resized.save(f"{path}/launcher_icon.png", "PNG")
              resized.save(f"{path}/ic_launcher.png", "PNG")
              print(f"Generated {path}/ic_launcher.png")
          PY

      - name: Change app name to OmaSales Mobile
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="[^"]*"/android:label="OmaSales Mobile"/g' $MANIFEST
            grep -n "android:label" $MANIFEST
          fi

      - name: Build APK
        run: flutter build apk --release --dart-define=API_BASE_URL="${{ inputs.api_url }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OmaSales-Mobile-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
