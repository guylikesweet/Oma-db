name: Build OmaSales Mobile

on:
  push:
    paths:
      - 'app/**'
      - 'mobile/**'
      - 'migrations/**'
      - 'requirements.txt'
      - '.github/workflows/build-oma-apk.yml'

  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API base URL'
        required: true
        default: 'https://oma-db.onrender.com/api'

permissions:
  contents: read

concurrency:
  group: oma-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:

      # ------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------------
      # 2. BACKEND + MOBILE PREFLIGHT
      # ------------------------------------------------------------
      - name: Backend and mobile compatibility preflight
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Python source..."
          python3 -m compileall -q app

          python3 - <<'PY'
          from pathlib import Path
          import re

          api_path = Path("app/api.py")
          models_path = Path("app/models.py")
          pubspec_path = Path("mobile/pubspec.yaml")

          if not api_path.exists():
              raise SystemExit("Missing app/api.py")

          if not models_path.exists():
              raise SystemExit("Missing app/models.py")

          if not pubspec_path.exists():
              raise SystemExit("Missing mobile/pubspec.yaml")

          api = api_path.read_text(encoding="utf-8")
          models = models_path.read_text(encoding="utf-8")
          pubspec = pubspec_path.read_text(encoding="utf-8")

          # --------------------------------------------------------
          # Required API routes
          # --------------------------------------------------------
          required_routes = [
              "/v1/auth/login",
              "/v1/auth/me",
              "/v1/auth/change-password",
              "/v1/auth/logout",

              "/v1/bootstrap",
              "/v1/sync",

              "/v1/products",
              "/v1/stock/adjust",
              "/v1/stock-log",

              "/v1/sales",

              "/v1/batches",

              "/v1/deliveries",
              "/v1/deliveries/ready",
              "/v1/deliveries/<int:delivery_id>/label.pdf",

              "/v1/shipping",

              "/v1/courier-rates",
              "/v1/monthly-shipping-rates",

              "/v1/reports/sales",
              "/v1/reports/shipping",
              "/v1/reports/inventory",

              "/v1/settings",

              "/v1/users",
              "/v1/users/<int:user_id>",

              "/v1/admin/clear-test-data",
          ]

          missing = [
              route for route in required_routes
              if route not in api
          ]

          if missing:
              raise SystemExit(
                  "Missing API routes:\n" +
                  "\n".join(f"  - {route}" for route in missing)
              )

          print("Required API routes: OK")

          # --------------------------------------------------------
          # Mobile sync models
          # --------------------------------------------------------
          for cls in ("MobileOperation", "MobileChange"):
              if not re.search(
                  rf"^class {cls}\b",
                  models,
                  re.MULTILINE,
              ):
                  raise SystemExit(
                      f"Missing required model: {cls}"
                  )

          if '__tablename__ = "mobile_operations"' not in models:
              raise SystemExit(
                  "MobileOperation must map to mobile_operations."
              )

          if '__tablename__ = "mobile_changes"' not in models:
              raise SystemExit(
                  "MobileChange must map to mobile_changes."
              )

          print("Mobile sync models: OK")

          # --------------------------------------------------------
          # Migration chain
          # --------------------------------------------------------
          versions = Path("migrations/versions")

          d4 = versions / (
              "d4f2c7a91e60_mobile_sync_infrastructure.py"
          )

          e71 = versions / (
              "e71c8b4f2d10_add_sale_client_operation_id.py"
          )

          merge = versions / "final_mobile_merge.py"

          for required in (d4, e71, merge):
              if not required.exists():
                  raise SystemExit(
                      f"Required migration missing: {required}"
                  )

          d4_text = d4.read_text(encoding="utf-8")
          e71_text = e71.read_text(encoding="utf-8")
          merge_text = merge.read_text(encoding="utf-8")

          if (
              'revision = "d4f2c7a91e60"' not in d4_text
              or
              'down_revision = "ca10b49cd246"' not in d4_text
          ):
              raise SystemExit(
                  "Unexpected d4 mobile migration chain."
              )

          if (
              'revision = "e71c8b4f2d10"' not in e71_text
              or
              'down_revision = "d4f2c7a91e60"' not in e71_text
          ):
              raise SystemExit(
                  "Unexpected e71 mobile migration chain."
              )

          if (
              'revision = "f7a1c9e4b210"' not in merge_text
              or
              "e71c8b4f2d10" not in merge_text
          ):
              raise SystemExit(
                  "Final mobile migration merge is invalid."
              )

          print("Mobile migration chain: OK")

          # --------------------------------------------------------
          # Prevent old duplicate migration from returning
          # --------------------------------------------------------
          obsolete = versions / (
              "7f0f6f0c8a21_add_mobile_sync_tables.py"
          )

          if obsolete.exists():
              raise SystemExit(
                  "Obsolete duplicate mobile-sync migration detected.\n"
                  "Delete:\n"
                  "migrations/versions/"
                  "7f0f6f0c8a21_add_mobile_sync_tables.py"
              )

          print("No obsolete duplicate migration: OK")

          # --------------------------------------------------------
          # Flutter package checks
          # --------------------------------------------------------
          if "name: oma_mobile" not in pubspec:
              raise SystemExit(
                  "mobile/pubspec.yaml does not define oma_mobile."
              )

          if "sdk: '>=3.3.0 <4.0.0'" not in pubspec:
              raise SystemExit(
                  "Unexpected Dart SDK constraint."
              )

          print("Flutter package configuration: OK")

          print("")
          print("Backend/mobile compatibility preflight: PASSED")
          PY


      # ------------------------------------------------------------
      # 3. INSTALL FLUTTER
      # ------------------------------------------------------------
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.0'
          cache: true


      # ------------------------------------------------------------
      # 4. FLUTTER DEPENDENCIES
      # ------------------------------------------------------------
      - name: Get Flutter dependencies
        run: flutter pub get


      # ------------------------------------------------------------
      # 5. FLUTTER ANALYSIS
      # ------------------------------------------------------------
      - name: Analyze Flutter code
        run: flutter analyze


      # ------------------------------------------------------------
      # 6. FLUTTER TESTS
      # ------------------------------------------------------------
      - name: Run Flutter tests when present
        shell: bash
        run: |
          set -euo pipefail

          if [ -d test ] && \
             find test -type f -name '*_test.dart' \
             -print -quit | grep -q .
          then
            flutter test
          else
            echo "No Dart tests found; skipping flutter test."
          fi


      # ------------------------------------------------------------
      # 7. CREATE ANDROID PROJECT
      # ------------------------------------------------------------
      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d android ]; then
            echo "Android project does not exist."
            echo "Creating Android project..."

            flutter create \
              --platforms=android \
              --org com.example \
              .
          else
            echo "Android project already exists."
          fi

          # Remove old Java activity if present.
          find android/app/src/main \
            -name 'MainActivity.java' \
            -delete || true

          # Remove old generated Kotlin package.
          rm -rf android/app/src/main/kotlin/io

          # Create our package.
          mkdir -p \
            android/app/src/main/kotlin/com/example/oma_mobile

          cat > android/app/src/main/kotlin/com/example/oma_mobile/MainActivity.kt <<'EOF'
          package com.example.oma_mobile

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity : FlutterActivity()
          EOF

          # --------------------------------------------------------
          # Android permissions + app name
          # --------------------------------------------------------
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "AndroidManifest.xml was not generated."
              )

          s = manifest.read_text(encoding="utf-8")

          if "android.permission.INTERNET" not in s:
              s = s.replace(
                  "<application",
                  (
                      '<uses-permission '
                      'android:name="android.permission.INTERNET" />\n'
                      '    <uses-permission '
                      'android:name='
                      '"android.permission.ACCESS_NETWORK_STATE" />\n'
                      "    <application"
                  ),
                  1,
              )

          s = s.replace(
              'android:label="Flutter Demo"',
              'android:label="OmaSales Mobile"',
          )

          manifest.write_text(
              s,
              encoding="utf-8",
          )

          print("Android project prepared.")
          PY


      # ------------------------------------------------------------
      # 8. INSTALL JAVA
      #
      # IMPORTANT:
      # Do NOT use setup-java Gradle caching here.
      #
      # The Android/Gradle project is generated dynamically above.
      # setup-java's automatic Gradle cache discovery can fail when
      # the repository initially has no Gradle wrapper files.
      # ------------------------------------------------------------
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ------------------------------------------------------------
      # 9. VALIDATE APP ICON
      # ------------------------------------------------------------
      - name: Validate and install launcher icon
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import struct

          src = Path("assets/images/app_icon.png")

          if not src.is_file():
              raise SystemExit(
                  "Missing assets/images/app_icon.png"
              )

          data = src.read_bytes()

          # PNG signature
          if not data.startswith(
              b"\x89PNG\r\n\x1a\n"
          ):
              raise SystemExit(
                  "assets/images/app_icon.png is not a valid PNG."
              )

          if len(data) < 24:
              raise SystemExit(
                  "PNG file is too small."
              )

          if data[12:16] != b"IHDR":
              raise SystemExit(
                  "PNG does not contain a valid IHDR."
              )

          width, height = struct.unpack(
              ">II",
              data[16:24],
          )

          if width <= 0 or height <= 0:
              raise SystemExit(
                  "PNG has invalid dimensions."
              )

          res = Path(
              "android/app/src/main/res"
          )

          folders = (
              "mipmap-mdpi",
              "mipmap-hdpi",
              "mipmap-xhdpi",
              "mipmap-xxhdpi",
              "mipmap-xxxhdpi",
          )

          for folder in folders:
              target = res / folder
              target.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              (
                  target / "ic_launcher.png"
              ).write_bytes(data)

              (
                  target / "launcher_icon.png"
              ).write_bytes(data)

          print(
              f"Launcher icon validated: "
              f"{width}x{height}"
          )
          PY


      # ------------------------------------------------------------
      # 10. CONFIGURE ANDROID SIGNING
      # ------------------------------------------------------------
      - name: Configure and validate Android release signing
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

        shell: bash

        run: |
          set -euo pipefail

          # --------------------------------------------------------
          # Check secrets
          # --------------------------------------------------------
          for required in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!required}" ]; then
              echo "Missing GitHub Actions secret: $required"
              exit 1
            fi
          done

          # --------------------------------------------------------
          # Decode keystore
          # --------------------------------------------------------
          printf '%s' \
            "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/oma-release.jks

          test -s android/app/oma-release.jks

          # --------------------------------------------------------
          # Create key.properties
          # --------------------------------------------------------
          python3 - <<'PY'
          import os
          from pathlib import Path

          values = {
              "storePassword":
                  os.environ["ANDROID_KEYSTORE_PASSWORD"],

              "keyPassword":
                  os.environ["ANDROID_KEY_PASSWORD"],

              "keyAlias":
                  os.environ["ANDROID_KEY_ALIAS"],

              "storeFile":
                  "oma-release.jks",
          }

          Path(
              "android/key.properties"
          ).write_text(
              "".join(
                  f"{key}={value}\n"
                  for key, value in values.items()
              ),
              encoding="utf-8",
          )
          PY

          # --------------------------------------------------------
          # Verify keystore + alias
          # --------------------------------------------------------
          keytool \
            -list \
            -keystore android/app/oma-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null

          echo "Android keystore validated."


          # --------------------------------------------------------
          # Configure Gradle release signing
          # --------------------------------------------------------
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "android/app/build.gradle"
          )

          if not path.exists():
              raise SystemExit(
                  "android/app/build.gradle was not generated."
              )

          s = path.read_text(
              encoding="utf-8"
          )

          # --------------------------------------------------------
          # Add keystore Properties loader before android {}
          # --------------------------------------------------------
          if "keystorePropertiesFile" not in s:

              android_match = re.search(
                  r"(?m)^android\s*\{",
                  s,
              )

              if not android_match:
                  raise SystemExit(
                      "Could not locate android { block."
                  )

              prefix = (
                  "def keystoreProperties = "
                  "new Properties()\n"
                  "def keystorePropertiesFile = "
                  "rootProject.file('key.properties')\n"
                  "if (keystorePropertiesFile.exists()) {\n"
                  "    keystoreProperties.load("
                  "new FileInputStream("
                  "keystorePropertiesFile))\n"
                  "}\n\n"
              )

              s = (
                  s[:android_match.start()]
                  + prefix
                  + s[android_match.start():]
              )


          # --------------------------------------------------------
          # Find buildTypes
          # --------------------------------------------------------
          build_types = re.search(
              r"(?m)^([ \t]*)buildTypes\s*\{",
              s,
          )

          if not build_types:
              raise SystemExit(
                  "Could not locate buildTypes {."
              )


          # --------------------------------------------------------
          # Add signingConfigs if missing
          # --------------------------------------------------------
          if "signingConfigs {" not in s:

              indent = build_types.group(1)

              signing = (
                  f"{indent}signingConfigs {{\n"
                  f"{indent}    release {{\n"
                  f"{indent}        keyAlias "
                  "keystoreProperties['keyAlias']\n"
                  f"{indent}        keyPassword "
                  "keystoreProperties['keyPassword']\n"
                  f"{indent}        storeFile "
                  "keystoreProperties['storeFile'] "
                  "? file(keystoreProperties['storeFile']) "
                  ": null\n"
                  f"{indent}        storePassword "
                  "keystoreProperties['storePassword']\n"
                  f"{indent}    }}\n"
                  f"{indent}}}\n\n"
              )

              s = (
                  s[:build_types.start()]
                  + signing
                  + s[build_types.start():]
              )


          # --------------------------------------------------------
          # Re-find buildTypes after modification
          # --------------------------------------------------------
          build_types = re.search(
              r"(?m)^([ \t]*)buildTypes\s*\{",
              s,
          )

          if not build_types:
              raise SystemExit(
                  "Could not relocate buildTypes block."
              )


          # --------------------------------------------------------
          # Find release block
          # --------------------------------------------------------
          tail = s[build_types.end():]

          release = re.search(
              r"(?m)^([ \t]*)release\s*\{",
              tail,
          )

          if not release:
              raise SystemExit(
                  "Could not locate release block."
              )

          release_abs = (
              build_types.end()
              + release.end()
          )

          release_indent = release.group(1)

          release_close = re.search(
              r"(?m)^"
              + re.escape(release_indent)
              + r"\}",
              s[release_abs:],
          )

          if not release_close:
              raise SystemExit(
                  "Could not locate release block end."
              )

          release_end = (
              release_abs
              + release_close.start()
          )

          release_block = s[
              release_abs:release_end
          ]


          # --------------------------------------------------------
          # Replace ANY existing release signingConfig
          # --------------------------------------------------------
          signing_line = (
              release_indent
              + "    signingConfig "
              + "signingConfigs.release"
          )

          existing = re.search(
              r"(?m)^[ \t]*signingConfig"
              r"(?:[ \t]*=[ \t]*)?"
              r"[ \t]+signingConfigs\.[A-Za-z0-9_]+"
              r"[ \t]*$",
              release_block,
          )

          if existing:

              release_block = re.sub(
                  r"(?m)^[ \t]*signingConfig"
                  r"(?:[ \t]*=[ \t]*)?"
                  r"[ \t]+signingConfigs\.[A-Za-z0-9_]+"
                  r"[ \t]*$",
                  signing_line,
                  release_block,
              )

          else:

              release_block = (
                  "\n"
                  + signing_line
                  + release_block
              )


          s = (
              s[:release_abs]
              + release_block
              + s[release_end:]
          )

          path.write_text(
              s,
              encoding="utf-8",
          )

          print(
              "Gradle release signing configuration "
              "written successfully."
          )
          PY


          # --------------------------------------------------------
          # Final signing check
          # --------------------------------------------------------
          grep -q \
            "signingConfig signingConfigs.release" \
            android/app/build.gradle

          echo "Android release signing configuration: OK"


      # ------------------------------------------------------------
      # 11. BUILD APK + AAB
      # ------------------------------------------------------------
      - name: Build signed APK and AAB
        env:
          API_URL: ${{ github.event.inputs.api_url || 'https://oma-db.onrender.com/api' }}

        shell: bash

        run: |
          set -euo pipefail

          echo "Using API:"
          echo "$API_URL"

          # Release builds must use HTTPS.
          case "$API_URL" in
            https://*)
              ;;
            *)
              echo "ERROR: API_URL must use HTTPS."
              echo "Received: $API_URL"
              exit 1
              ;;
          esac

          echo "Building release APK..."

          flutter build apk \
            --release \
            --dart-define=API_BASE_URL="$API_URL"

          echo "Building release AAB..."

          flutter build appbundle \
            --release \
            --dart-define=API_BASE_URL="$API_URL"

          # --------------------------------------------------------
          # Verify artifacts
          # --------------------------------------------------------
          test -s \
            build/app/outputs/flutter-apk/app-release.apk

          test -s \
            build/app/outputs/bundle/release/app-release.aab

          echo ""
          echo "=========================================="
          echo "BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "APK:"
          echo "build/app/outputs/flutter-apk/app-release.apk"
          echo ""
          echo "AAB:"
          echo "build/app/outputs/bundle/release/app-release.aab"


      # ------------------------------------------------------------
      # 12. UPLOAD BUILD ARTIFACTS
      # ------------------------------------------------------------
      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: OmaSales-Mobile-${{ github.run_number }}

          if-no-files-found: error

          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
