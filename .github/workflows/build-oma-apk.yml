name: Build Oma Mobile APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Backend API base URL
        required: true
        default: https://oma-db.onrender.com/api
        type: string

permissions:
  contents: write

concurrency:
  group: oma-mobile-apk
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Install Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pubspec.lock ]; then
            flutter pub get --enforce-lockfile
          else
            flutter pub get
          fi

      # First successful manual build pins the complete transitive dependency
      # graph. Later builds use --enforce-lockfile and cannot silently drift.
      - name: Commit initial Flutter dependency lock
        if: github.ref == 'refs/heads/main'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch mobile/pubspec.lock >/dev/null 2>&1; then
            echo "Flutter dependency lock is already tracked."
            exit 0
          fi
          test -s mobile/pubspec.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f mobile/pubspec.lock
          git commit -m "build: pin OmaSales Flutter dependencies [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin "HEAD:main"

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            rm -rf android
            flutter create --platforms=android --org com.example .
          fi

      - name: Configure Android app, Firebase, desugaring and release signing
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          package = "com.omagroup.salesapp"
          firebase_raw = os.environ.get("FIREBASE_GOOGLE_SERVICES_JSON", "").strip()
          if not firebase_raw:
              raise SystemExit("Missing GitHub secret FIREBASE_GOOGLE_SERVICES_JSON.")
          try:
              firebase = json.loads(firebase_raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"FIREBASE_GOOGLE_SERVICES_JSON is invalid: {exc}")
          clients = firebase.get("client", [])
          if not any(
              c.get("client_info", {}).get("android_client_info", {}).get("package_name") == package
              for c in clients
          ):
              raise SystemExit(f"Firebase config has no Android client for {package}.")
          if firebase.get("project_info", {}).get("project_id") != "omasales-5208e":
              raise SystemExit("Firebase config is not for the OmaSales Firebase project.")
          Path("android/app/google-services.json").write_text(firebase_raw + "\n", encoding="utf-8")

          gradle = next((p for p in (
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ) if p.is_file()), None)
          settings = next((p for p in (
              Path("android/settings.gradle.kts"),
              Path("android/settings.gradle"),
          ) if p.is_file()), None)
          if not gradle or not settings:
              raise SystemExit("Flutter did not generate the Android Gradle project.")
          kts = gradle.suffix == ".kts"
          settings_kts = settings.suffix == ".kts"
          app_text = gradle.read_text(encoding="utf-8")
          settings_text = settings.read_text(encoding="utf-8")

          for key in ("namespace", "applicationId"):
              pattern = re.compile(r'(?m)^([ \t]*)' + key + r'(?:[ \t]*=[ \t]*|[ \t]+)["\'][^"\']*["\']')
              replacement = (lambda m, k=key: f'{m.group(1)}{k} = "{package}"') if kts else (lambda m, k=key: f'{m.group(1)}{k} "{package}"')
              app_text, count = pattern.subn(replacement, app_text, count=1)
              if not count:
                  raise SystemExit(f"Could not set Android {key} in {gradle}.")

          settings_plugin = 'id("com.google.gms.google-services") version "4.4.2" apply false' if settings_kts else 'id "com.google.gms.google-services" version "4.4.2" apply false'
          app_plugin = 'id("com.google.gms.google-services")' if kts else 'id "com.google.gms.google-services"'
          if "com.google.gms.google-services" not in settings_text:
              m = re.search(r'(?m)^plugins\s*\{', settings_text)
              if not m:
                  raise SystemExit("No plugins block found in Android settings.")
              settings_text = settings_text[:m.end()] + "\n    " + settings_plugin + settings_text[m.end():]
          if "com.google.gms.google-services" not in app_text:
              m = re.search(r'(?m)^plugins\s*\{', app_text)
              if not m:
                  raise SystemExit("No plugins block found in Android app Gradle file.")
              app_text = app_text[:m.end()] + "\n    " + app_plugin + app_text[m.end():]

          min_line = "minSdk = 23" if kts else "minSdkVersion 23"
          min_pattern = re.compile(r'(?m)^([ \t]*)minSdk(?:Version)?(?:[ \t]*=[ \t]*|[ \t]+)\S.*$')
          if min_pattern.search(app_text):
              app_text = min_pattern.sub(lambda m: m.group(1) + min_line, app_text, count=1)
          else:
              m = re.search(r'(?m)^([ \t]*)defaultConfig\s*\{', app_text)
              if not m:
                  raise SystemExit("No defaultConfig block found in Android app Gradle file.")
              app_text = app_text[:m.end()] + "\n        " + min_line + app_text[m.end():]

          compile_block = re.search(r'(?ms)^([ \t]*)compileOptions\s*\{(.*?)^\1\}', app_text)
          desugar_line = "isCoreLibraryDesugaringEnabled = true" if kts else "coreLibraryDesugaringEnabled true"
          if compile_block:
              if "isCoreLibraryDesugaringEnabled" not in compile_block.group(2) and "coreLibraryDesugaringEnabled" not in compile_block.group(2):
                  pos = compile_block.start(2)
                  app_text = app_text[:pos] + "\n            " + desugar_line + app_text[pos:]
          else:
              m = re.search(r'(?m)^([ \t]*)android\s*\{', app_text)
              if not m:
                  raise SystemExit("No android block found in app Gradle file.")
              app_text = app_text[:m.end()] + "\n    compileOptions {\n        " + desugar_line + "\n    }" + app_text[m.end():]
          dep_line = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")' if kts else "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          dep = re.search(r'(?ms)^dependencies\s*\{(.*?)^\}', app_text)
          if dep:
              if "desugar_jdk_libs" not in dep.group(1):
                  app_text = app_text[:dep.start(1)] + "\n    " + dep_line + app_text[dep.start(1):]
          else:
              app_text += "\n\ndependencies {\n    " + dep_line + "\n}\n"

          required = ("ANDROID_KEYSTORE_BASE64", "ANDROID_KEYSTORE_PASSWORD", "ANDROID_KEY_ALIAS", "ANDROID_KEY_PASSWORD")
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit("Missing Android signing secrets: " + ", ".join(missing))
          import base64
          keystore = base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True)
          if not keystore:
              raise SystemExit("ANDROID_KEYSTORE_BASE64 decoded to an empty keystore.")
          Path("android/app/oma-release.jks").write_bytes(keystore)
          Path("android/key.properties").write_text(
              "storePassword=" + os.environ["ANDROID_KEYSTORE_PASSWORD"] + "\n" +
              "keyPassword=" + os.environ["ANDROID_KEY_PASSWORD"] + "\n" +
              "keyAlias=" + os.environ["ANDROID_KEY_ALIAS"] + "\n" +
              "storeFile=oma-release.jks\n",
              encoding="utf-8",
          )

          if kts:
              loader = """import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          """
              if "keystorePropertiesFile" not in app_text:
                  m = re.search(r'(?m)^android\s*\{', app_text)
                  if not m:
                      raise SystemExit("No android block found for signing properties.")
                  app_text = app_text[:m.start()] + loader + app_text[m.start():]
              if 'create("release")' not in app_text:
                  m = re.search(r'(?m)^([ \t]*)buildTypes\s*\{', app_text)
                  if not m:
                      raise SystemExit("No buildTypes block found for signing config.")
                  indent = m.group(1)
                  signing = (
                      indent + 'signingConfigs {\n' +
                      indent + '    create("release") {\n' +
                      indent + '        keyAlias = keystoreProperties["keyAlias"] as String\n' +
                      indent + '        keyPassword = keystoreProperties["keyPassword"] as String\n' +
                      indent + '        storeFile = keystoreProperties["storeFile"]?.let { file(it as String) }\n' +
                      indent + '        storePassword = keystoreProperties["storePassword"] as String\n' +
                      indent + '    }\n' + indent + '}\n'
                  )
                  app_text = app_text[:m.start()] + signing + app_text[m.start():]
          else:
              if "keystorePropertiesFile" not in app_text:
                  m = re.search(r'(?m)^android\s*\{', app_text)
                  if not m:
                      raise SystemExit("No android block found for signing properties.")
                  loader = (
                      "def keystoreProperties = new Properties()\n"
                      "def keystorePropertiesFile = rootProject.file('key.properties')\n"
                      "if (keystorePropertiesFile.exists()) {\n"
                      "    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n"
                      "}\n\n"
                  )
                  app_text = app_text[:m.start()] + loader + app_text[m.start():]
              if "signingConfigs {" not in app_text:
                  m = re.search(r'(?m)^([ \t]*)buildTypes\s*\{', app_text)
                  if not m:
                      raise SystemExit("No buildTypes block found for signing config.")
                  indent = m.group(1)
                  signing = (
                      indent + "signingConfigs {\n" +
                      indent + "    release {\n" +
                      indent + "        keyAlias keystoreProperties['keyAlias']\n" +
                      indent + "        keyPassword keystoreProperties['keyPassword']\n" +
                      indent + "        storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null\n" +
                      indent + "        storePassword keystoreProperties['storePassword']\n" +
                      indent + "    }\n" + indent + "}\n"
                  )
                  app_text = app_text[:m.start()] + signing + app_text[m.start():]

          build_types = re.search(r'(?m)^([ \t]*)buildTypes\s*\{', app_text)
          if not build_types:
              raise SystemExit("No buildTypes block found.")
          release_pattern = r'(?m)^([ \t]*)(?:getByName\("release"\)|release)\s*\{' if kts else r'(?m)^([ \t]*)release\s*\{'
          release = re.search(release_pattern, app_text[build_types.end():])
          if not release:
              raise SystemExit("No release build type found inside buildTypes.")
          insert = build_types.end() + release.end()
          release_indent = release.group(1)
          close = app_text.find("\n" + release_indent + "}", insert)
          if close < 0:
              raise SystemExit("Could not find the end of the release build type.")
          signing_line = (
              release_indent + '    signingConfig = signingConfigs.getByName("release")'
              if kts else
              release_indent + "    signingConfig signingConfigs.release"
          )
          release_body = app_text[insert:close]
          if kts:
              release_body, signing_count = re.subn(
                  r'(?m)^[ \t]*signingConfig\s*=.*$',
                  lambda _: signing_line,
                  release_body,
              )
          else:
              release_body, signing_count = re.subn(
                  r'(?m)^[ \t]*signingConfig\s+.*$',
                  lambda _: signing_line,
                  release_body,
              )
          if signing_count == 0:
              release_body = "\n" + signing_line + release_body
          app_text = app_text[:insert] + release_body + app_text[close:]
          if signing_line.strip() not in release_body:
              raise SystemExit("Release build is not configured to use the uploaded production keystore.")

          gradle.write_text(app_text, encoding="utf-8")
          settings.write_text(settings_text, encoding="utf-8")

          import subprocess
          subprocess.run([
              "keytool", "-list", "-keystore", "android/app/oma-release.jks",
              "-storepass", os.environ["ANDROID_KEYSTORE_PASSWORD"],
              "-alias", os.environ["ANDROID_KEY_ALIAS"]
          ], check=True, stdout=subprocess.DEVNULL)

          kotlin_dir = Path("android/app/src/main/kotlin/com/omagroup/salesapp")
          kotlin_dir.mkdir(parents=True, exist_ok=True)
          for old in Path("android/app/src/main/kotlin").glob("**/MainActivity.kt"):
              if old != kotlin_dir / "MainActivity.kt":
                  old.unlink()
          java_dir = Path("android/app/src/main/java")
          if java_dir.exists():
              for old in java_dir.glob("**/MainActivity.java"):
                  old.unlink()
          (kotlin_dir / "MainActivity.kt").write_text("""package com.omagroup.salesapp

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.media.AudioAttributes
          import android.os.Build
          import android.util.Log
          import io.flutter.embedding.android.FlutterFragmentActivity

          class MainActivity : FlutterFragmentActivity() {
              override fun onCreate(savedInstanceState: android.os.Bundle?) {
                  super.onCreate(savedInstanceState)
                  createOmaNotificationChannels()
              }

              override fun onStart() {
                  Log.i("OmaStartup", "MainActivity.onStart entering")
                  super.onStart()
                  Log.i("OmaStartup", "MainActivity.onStart completed")
              }

              private fun createOmaNotificationChannels() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.O) return
                  try {
                      val manager = getSystemService(NotificationManager::class.java)
                      if (manager == null) {
                          Log.w("OmaStartup", "NotificationManager unavailable; continuing without custom channels")
                          return
                      }
                      val audio = AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_NOTIFICATION)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build()
                      val channels = listOf(
                          Triple("oma_scanner_v3", "Oma scanner", "scanner_beep"),
                          Triple("oma_arrival_sea_v3", "Sea shipment arrivals", "ship_horn"),
                          Triple("oma_arrival_air_v3", "Air shipment arrivals", "airport_arrival"),
                          Triple("oma_chat_v3", "Oma team chat", "chat_message")
                      )
                      for ((id, name, soundName) in channels) {
                          try {
                              val sound = resources.getIdentifier(soundName, "raw", packageName)
                              val channel = NotificationChannel(id, name, NotificationManager.IMPORTANCE_HIGH)
                              channel.enableVibration(true)
                              if (sound != 0) {
                                  val uri = android.net.Uri.parse("android.resource://" + packageName + "/" + sound)
                                  channel.setSound(uri, audio)
                              }
                              manager.createNotificationChannel(channel)
                          } catch (error: Exception) {
                              Log.w("OmaStartup", "Unable to create notification channel $id; continuing", error)
                          }
                      }
                  } catch (error: Exception) {
                      Log.w("OmaStartup", "Notification channel setup failed; continuing app startup", error)
                  }
              }
          }
          """, encoding="utf-8")

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text(encoding="utf-8")
          permissions = (
              "INTERNET", "ACCESS_NETWORK_STATE", "ACCESS_COARSE_LOCATION",
              "ACCESS_FINE_LOCATION", "USE_BIOMETRIC", "RECORD_AUDIO",
              "POST_NOTIFICATIONS", "RECEIVE_BOOT_COMPLETED"
          )
          for permission in permissions:
              marker = f'android:name="android.permission.{permission}"'
              if marker not in xml:
                  xml = xml.replace("<application", f'    <uses-permission android:name="android.permission.{permission}" />\n    <application', 1)
          xml = xml.replace('android:label="mobile"', 'android:label="OmaSales Mobile"')
          xml = xml.replace('android:label="oma_mobile"', 'android:label="OmaSales Mobile"')
          manifest.write_text(xml, encoding="utf-8")

          import math, shutil, struct, wave
          raw_dir = Path("android/app/src/main/res/raw")
          raw_dir.mkdir(parents=True, exist_ok=True)
          sound_files = {
              "scanner_beep.wav": (0.18, (1850, 2400)),
              "ship_horn.wav": (0.72, (330, 392)),
              "airport_arrival.wav": (0.62, (523, 659, 784)),
              "chat_message.wav": (0.24, (880, 1175)),
          }
          for filename, (duration, frequencies) in sound_files.items():
              target = raw_dir / filename
              source = Path("assets/notifications") / filename
              if source.is_file() and source.stat().st_size:
                  shutil.copy2(source, target)
              else:
                  rate = 44100
                  with wave.open(str(target), "wb") as wav:
                      wav.setnchannels(1)
                      wav.setsampwidth(2)
                      wav.setframerate(rate)
                      frames = int(duration * rate)
                      samples = bytearray()
                      for i in range(frames):
                          t = i / rate
                          envelope = min(1.0, i / (rate * .012)) * min(1.0, (frames-i)/(rate*.035))
                          value = sum(math.sin(2*math.pi*f*t) for f in frequencies) / len(frequencies)
                          samples.extend(struct.pack("<h", int(32767 * .38 * envelope * value)))
                      wav.writeframes(samples)

          print("Android identity, Firebase, signing, permissions and sound resources configured.")
          PY

      - name: Persist Android platform configuration
        if: github.ref == 'refs/heads/main'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test -s mobile/android/gradle/wrapper/gradle-wrapper.properties
          test -s mobile/android/app/src/main/AndroidManifest.xml
          test -s mobile/android/app/src/main/kotlin/com/omagroup/salesapp/MainActivity.kt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mobile/android
          if ! git diff --cached --quiet; then
            while IFS= read -r path; do
              case "$path" in
                */google-services.json|*/key.properties|*.jks)
                  echo "Refusing to commit Firebase or Android signing material: $path"
                  exit 1
                  ;;
              esac
            done < <(git diff --cached --name-only)
            git commit -m "build: persist OmaSales Android platform configuration [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin "HEAD:main"
          else
            echo "Android platform configuration is already current."
          fi

      - name: Analyze Flutter source and run tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -f test/widget_test.dart ] &&
             grep -q 'MyApp' test/widget_test.dart &&
             ! grep -R --include='*.dart' -q 'class MyApp' lib; then
            echo "Removing incompatible Flutter scaffold test (MyApp is not part of OmaSales)."
            rm test/widget_test.dart
          fi
          flutter analyze --no-pub --no-fatal-infos
          flutter test --no-pub

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Build signed release APK
        id: build_apk
        env:
          API_URL: ${{ inputs.api_url }}
          FCM_API_KEY: ${{ secrets.FCM_API_KEY }}
          FCM_APP_ID: ${{ secrets.FCM_APP_ID }}
          FCM_MESSAGING_SENDER_ID: ${{ secrets.FCM_MESSAGING_SENDER_ID }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_AUTH_DOMAIN: ${{ secrets.FCM_AUTH_DOMAIN }}
          FCM_STORAGE_BUCKET: ${{ secrets.FCM_STORAGE_BUCKET }}
          FCM_WEB_VAPID_KEY: ${{ secrets.FCM_WEB_VAPID_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          case "$API_URL" in
            https://*) ;;
            *) echo "API_URL must use HTTPS."; exit 1 ;;
          esac
          for key in FCM_API_KEY FCM_APP_ID FCM_MESSAGING_SENDER_ID FCM_PROJECT_ID; do
            if [ -z "${!key:-}" ]; then
              echo "Missing GitHub Actions secret: $key"
              exit 1
            fi
          done
          flutter build apk --release --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=API_BASE_URL="$API_URL" \
            --dart-define=FCM_API_KEY="$FCM_API_KEY" \
            --dart-define=FCM_APP_ID="$FCM_APP_ID" \
            --dart-define=FCM_MESSAGING_SENDER_ID="$FCM_MESSAGING_SENDER_ID" \
            --dart-define=FCM_PROJECT_ID="$FCM_PROJECT_ID" \
            --dart-define=FCM_AUTH_DOMAIN="$FCM_AUTH_DOMAIN" \
            --dart-define=FCM_STORAGE_BUCKET="$FCM_STORAGE_BUCKET" \
            --dart-define=FCM_WEB_VAPID_KEY="$FCM_WEB_VAPID_KEY"
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p build/named
          cp build/app/outputs/flutter-apk/app-release.apk build/named/OmaSales-Mobile.apk
          echo "Release APK built successfully."

      - name: Build debug APK and capture Android dependency graphs
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=API_BASE_URL="${{ inputs.api_url }}" \
            --dart-define=FCM_API_KEY="${{ secrets.FCM_API_KEY }}" \
            --dart-define=FCM_APP_ID="${{ secrets.FCM_APP_ID }}" \
            --dart-define=FCM_MESSAGING_SENDER_ID="${{ secrets.FCM_MESSAGING_SENDER_ID }}" \
            --dart-define=FCM_PROJECT_ID="${{ secrets.FCM_PROJECT_ID }}" \
            --dart-define=FCM_AUTH_DOMAIN="${{ secrets.FCM_AUTH_DOMAIN }}" \
            --dart-define=FCM_STORAGE_BUCKET="${{ secrets.FCM_STORAGE_BUCKET }}" \
            --dart-define=FCM_WEB_VAPID_KEY="${{ secrets.FCM_WEB_VAPID_KEY }}"
          test -s build/app/outputs/flutter-apk/app-debug.apk
          cp build/app/outputs/flutter-apk/app-debug.apk build/named/OmaSales-Mobile-debug.apk
          mkdir -p build/android-dependency-reports
          cd android
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath > ../build/android-dependency-reports/debugRuntimeClasspath.txt
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > ../build/android-dependency-reports/releaseRuntimeClasspath.txt
          ./gradlew :app:tasks --all > ../build/android-dependency-reports/gradle-tasks.txt
          echo "Debug APK and Android dependency reports generated."

      - name: Android 16 release startup smoke test
        # Use a directly managed emulator: the third-party runner's post-boot
        # keyevent was failing with a broken ADB pipe before our script ran.
        timeout-minutes: 40
        working-directory: .
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK="$(printenv ANDROID_SDK_ROOT || true)"
          if [ -z "$SDK" ]; then SDK="$(printenv ANDROID_HOME || true)"; fi
          if [ -z "$SDK" ]; then SDK="/usr/local/lib/android/sdk"; fi
          export ANDROID_SDK_ROOT="$SDK"
          export ANDROID_HOME="$SDK"
          export PATH="$SDK/platform-tools:$SDK/emulator:$SDK/cmdline-tools/latest/bin:$PATH"
          # Pin AVD creation and lookup to the same directory. GitHub runners
          # can expose a different SDK home to avdmanager and emulator.
          AVD_NAME="oma-smoke"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          RELEASE_APK="$GITHUB_WORKSPACE/mobile/build/named/OmaSales-Mobile.apk"
          DEBUG_APK="$GITHUB_WORKSPACE/mobile/build/named/OmaSales-Mobile-debug.apk"
          OUT="$GITHUB_WORKSPACE/mobile/build/android-smoke"
          SERIAL="emulator-5554"
          mkdir -p "$OUT"
          EMULATOR_PID=""

          collect_diagnostics() {
            set +e
            adb devices -l > "$OUT/adb-devices.txt" 2>&1
            timeout 20s adb -s "$SERIAL" shell getprop > "$OUT/android-properties.txt" 2>&1
            timeout 30s adb -s "$SERIAL" logcat -d -v time > "$OUT/logcat.txt" 2>&1
            if [ -f "$OUT/emulator.log" ]; then
              tail -n 300 "$OUT/emulator.log" > "$OUT/emulator-tail.txt"
            fi
            set -e
          }

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "Smoke test failed (exit $status); collecting emulator diagnostics."
              collect_diagnostics
            else
              timeout 30s adb -s "$SERIAL" logcat -d -v time > "$OUT/logcat.txt" 2>&1 || true
            fi
            if [ -n "$EMULATOR_PID" ] && kill -0 "$EMULATOR_PID" 2>/dev/null; then
              kill -TERM "$EMULATOR_PID" 2>/dev/null || true
              for _ in $(seq 1 15); do
                kill -0 "$EMULATOR_PID" 2>/dev/null || break
                sleep 1
              done
              kill -KILL "$EMULATOR_PID" 2>/dev/null || true
              wait "$EMULATOR_PID" 2>/dev/null || true
            fi
            exit "$status"
          }
          trap cleanup EXIT

          echo "Debug APK path: $DEBUG_APK"
          echo "Release APK path: $RELEASE_APK"
          test -s "$DEBUG_APK" || { echo "ERROR: debug APK is missing or empty."; exit 1; }
          test -s "$RELEASE_APK" || { echo "ERROR: release APK is missing or empty."; exit 1; }
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install emulator platform-tools 'platforms;android-36' 'system-images;android-36;google_apis;x86_64'
          echo "Creating Android Virtual Device '$AVD_NAME' in $ANDROID_AVD_HOME."
          echo no | avdmanager create avd --force --name "$AVD_NAME" --package 'system-images;android-36;google_apis;x86_64' --device pixel_6 --path "$ANDROID_AVD_HOME/$AVD_NAME.avd"
          if [ ! -s "$ANDROID_AVD_HOME/$AVD_NAME.ini" ] || [ ! -s "$ANDROID_AVD_HOME/$AVD_NAME.avd/config.ini" ]; then
            echo "ERROR: avdmanager did not create the expected AVD files."
            echo "Expected: $ANDROID_AVD_HOME/$AVD_NAME.ini"
            echo "Expected: $ANDROID_AVD_HOME/$AVD_NAME.avd/config.ini"
            find "$HOME/.android" -maxdepth 4 -type f -print 2>/dev/null || true
            exit 1
          fi
          echo "AVD files verified:"
          ls -l "$ANDROID_AVD_HOME/$AVD_NAME.ini" "$ANDROID_AVD_HOME/$AVD_NAME.avd/config.ini"
          adb start-server

          echo "Preparing KVM permissions for the GitHub-hosted runner."
          if [ ! -e /dev/kvm ]; then
            echo "ERROR: This runner does not expose /dev/kvm; an x86_64 Android emulator cannot run reliably here."
            exit 1
          fi
          # GitHub-hosted Ubuntu runners may expose KVM but omit the ephemeral
          # Actions user from the kvm group. Grant this job access to the device.
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          echo "Verifying KVM acceleration access."
          emulator -accel-check

          echo "Starting Android 16 emulator with KVM acceleration."
          emulator -avd "$AVD_NAME" -port 5554 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none -camera-front none -accel on > "$OUT/emulator.log" 2>&1 &
          EMULATOR_PID=$!

          BOOT_DEADLINE=$((SECONDS + 1800))
          echo "Waiting up to 30 minutes for the emulator's ADB device."
          until adb devices | grep -Eq "^$SERIAL[[:space:]]+device$"; do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "ERROR: emulator process exited before ADB became ready."
              tail -n 160 "$OUT/emulator.log" || true
              exit 1
            fi
            if [ "$SECONDS" -ge "$BOOT_DEADLINE" ]; then
              echo "ERROR: emulator did not connect to ADB within 30 minutes."
              exit 1
            fi
            sleep 5
          done

          echo "ADB connected; waiting for Android system boot to complete."
          until [ "$(timeout 25s adb -s "$SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "ERROR: emulator process exited during Android boot."
              exit 1
            fi
            if [ "$SECONDS" -ge "$BOOT_DEADLINE" ]; then
              echo "ERROR: Android did not finish booting within 30 minutes."
              exit 1
            fi
            sleep 5
          done

          echo "Android 16 boot completed."
          timeout 30s adb -s "$SERIAL" shell settings put global window_animation_scale 0
          timeout 30s adb -s "$SERIAL" shell settings put global transition_animation_scale 0
          timeout 30s adb -s "$SERIAL" shell settings put global animator_duration_scale 0
          timeout 30s adb -s "$SERIAL" logcat -c

          for VARIANT in debug release; do
            if [ "$VARIANT" = "debug" ]; then APK="$DEBUG_APK"; else APK="$RELEASE_APK"; fi
            echo "===== Testing OmaSales $VARIANT APK ====="
            timeout 30s adb -s "$SERIAL" shell am force-stop com.omagroup.salesapp || true
            timeout 30s adb -s "$SERIAL" uninstall com.omagroup.salesapp >/dev/null 2>&1 || true
            timeout 30s adb -s "$SERIAL" logcat -c
            if INSTALL_RESULT="$(timeout 300s adb -s "$SERIAL" install "$APK" 2>&1)"; then
              echo "$INSTALL_RESULT"
            else
              INSTALL_STATUS=$?
              echo "$INSTALL_RESULT"
              echo "OmaSales $VARIANT APK installation failed (exit $INSTALL_STATUS)."
              exit "$INSTALL_STATUS"
            fi

            echo "Launching OmaSales $VARIANT APK."
            if START_RESULT="$(timeout 45s adb -s "$SERIAL" shell am start -W -n com.omagroup.salesapp/.MainActivity 2>&1)"; then
              echo "$START_RESULT"
            else
              START_STATUS=$?
              echo "$START_RESULT"
              echo "OmaSales $VARIANT activity launch failed (exit $START_STATUS)."
              exit "$START_STATUS"
            fi
            echo "$START_RESULT" | grep -q "Status: ok" || { echo "Android did not confirm $VARIANT activity launch."; exit 1; }

            for attempt in $(seq 1 15); do
              sleep 2
              timeout 25s adb -s "$SERIAL" logcat -d -v time > "$OUT/logcat-$VARIANT.txt"
              if grep -q "FATAL EXCEPTION" "$OUT/logcat-$VARIANT.txt"; then
                echo "Fatal Android exception during $VARIANT cold start:"
                grep -A 45 -B 8 "FATAL EXCEPTION" "$OUT/logcat-$VARIANT.txt" || true
                exit 1
              fi
            done

            if timeout 30s adb -s "$SERIAL" shell pidof com.omagroup.salesapp >/dev/null 2>&1; then
              echo "PASS: OmaSales $VARIANT APK remained running for 30 seconds."
            else
              echo "FAIL: OmaSales $VARIANT process exited."
              tail -n 180 "$OUT/logcat-$VARIANT.txt" || true
              exit 1
            fi
          done
          echo "PASS: both debug and release APKs survived Android 16 cold-start smoke tests."
      - name: Collect Android build diagnostics
        if: always()
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          OUT="mobile/build/android-diagnostics"
          mkdir -p "$OUT"
          for file in \
            mobile/pubspec.lock \
            mobile/android/app/src/main/AndroidManifest.xml \
            mobile/android/app/src/main/kotlin/com/omagroup/salesapp/MainActivity.kt \
            mobile/android/app/build.gradle.kts \
            mobile/android/app/build.gradle \
            mobile/android/settings.gradle.kts \
            mobile/android/settings.gradle \
            mobile/android/build.gradle.kts \
            mobile/android/build.gradle \
            mobile/android/gradle.properties \
            mobile/android/gradle/wrapper/gradle-wrapper.properties \
            mobile/build/android-startup-logcat.txt; do
            if [ -f "$file" ]; then
              cp "$file" "$OUT/"
            fi
          done
          git rev-parse HEAD > "$OUT/source-commit.txt"
          (cd mobile && flutter --version) > "$OUT/flutter-version.txt" 2>&1 || true
          if [ -d mobile/build/android-smoke ]; then
            cp -a mobile/build/android-smoke "$OUT/"
          fi
          if [ -d mobile/build/android-dependency-reports ]; then
            cp -a mobile/build/android-dependency-reports "$OUT/"
          fi
          for apk in mobile/build/named/OmaSales-Mobile-debug.apk mobile/build/named/OmaSales-Mobile.apk; do
            if [ -s "$apk" ]; then sha256sum "$apk" >> "$OUT/apk-sha256.txt"; fi
          done

      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: OmaSales-Android-Diagnostics-${{ github.run_number }}
          path: mobile/build/android-diagnostics
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK artifact
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: OmaSales-APK-${{ github.run_number }}
          path: mobile/build/named/OmaSales-Mobile.apk
          if-no-files-found: error
          retention-days: 14
