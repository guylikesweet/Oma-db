name: Build OmaSales Mobile

on:
  # Automatic push/PR builds are intentionally disabled.
  # Builds must be started manually from the Actions tab.
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API base URL'
        required: true
        default: 'https://oma-db.onrender.com/api'

permissions:
  contents: read

concurrency:
  group: oma-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: mobile

    steps:

      # ------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # ------------------------------------------------------------
      # 2. BACKEND + MOBILE PREFLIGHT
      # ------------------------------------------------------------
      - name: Backend and mobile compatibility preflight
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Python source..."
          python3 -m compileall -q app

          python3 - <<'PY'
          from pathlib import Path
          import re

          api_path = Path("app/api.py")
          models_path = Path("app/models.py")
          pubspec_path = Path("mobile/pubspec.yaml")

          if not api_path.exists():
              raise SystemExit("Missing app/api.py")

          if not models_path.exists():
              raise SystemExit("Missing app/models.py")

          if not pubspec_path.exists():
              raise SystemExit("Missing mobile/pubspec.yaml")

          api = api_path.read_text(encoding="utf-8")
          models = models_path.read_text(encoding="utf-8")
          pubspec = pubspec_path.read_text(encoding="utf-8")

          # --------------------------------------------------------
          # Required API routes
          # --------------------------------------------------------
          required_routes = [
              # Authentication/session endpoints used by the mobile client.
              "/v1/auth/login",
              "/v1/auth/me",
              "/v1/auth/biometric-login",
              "/v1/auth/verify-password",
              "/v1/auth/change-password",
              "/v1/auth/change-username",
              "/v1/auth/logout",
              "/v1/profile",
              "/v1/users/<int:user_id>/avatar",

              # Bootstrap/sync endpoints.
              "/v1/bootstrap",
              "/v1/sync",

              # Products, stock and sales.
              "/v1/products",
              "/v1/products/cost-calculator",
              "/v1/products/<int:product_id>",
              "/v1/stock/adjust",
              "/v1/stock-log",
              "/v1/sales",
              "/v1/sales/<int:sale_id>",
              "/v1/sales/<int:sale_id>/journey",

              # Shipment/batch/delivery/shipping endpoints.
              "/v1/batches",
              "/v1/batches/<int:batch_id>",
              "/v1/deliveries",
              "/v1/deliveries/ready",
              "/v1/deliveries/<int:delivery_id>/label.pdf",
              "/v1/shipping",
              "/v1/courier-rates",
              "/v1/monthly-shipping-rates",

              # Reports/dashboard/audit/settings/users/admin.
              "/v1/dashboard",
              "/v1/audit",
              "/v1/reports/sales",
              "/v1/reports/shipping",
              "/v1/reports/inventory",
              "/v1/settings",
              "/v1/users",
              "/v1/users/<int:user_id>",
              "/v1/admin/clear-test-data",

              # Push registration and Team Chat.
              "/v1/notifications/register-device",
              "/v1/notifications/unregister-device",
              "/v1/chat/diagnostic",
              "/v1/chat/messages",
              "/v1/chat/messages/<int:message_id>",
              "/v1/chat/messages/<int:message_id>/react",
              "/v1/chat/messages/<int:message_id>/audio-token",
              "/v1/chat/messages/<int:message_id>/audio",
              "/v1/products/<int:product_id>/image",
          ]

          missing = [
              route for route in required_routes
              if route not in api
          ]

          if missing:
              raise SystemExit(
                  "Missing API routes:\n" +
                  "\n".join(f"  - {route}" for route in missing)
              )

          print("Required API routes: OK")

          # --------------------------------------------------------
          # Product landed-cost/pricing contract
          # --------------------------------------------------------
          for required in (
              "supplier_cost",
              "inbound_shipping_cost",
              "markup_percent",
              "selling_price",
          ):
              if required not in models:
                  raise SystemExit(
                      f"Missing Product finance field: {required}"
                  )

          if "/v1/products/cost-calculator" not in api:
              raise SystemExit(
                  "Missing product cost calculator endpoint."
              )

          print("Product landed-cost/pricing contract: OK")

          # --------------------------------------------------------
          # Mobile sync models
          # --------------------------------------------------------
          for cls in ("MobileOperation", "MobileChange", "MonthlyAirRate", "SaleJourneyEvent"):
              if not re.search(
                  rf"^class {cls}\b",
                  models,
                  re.MULTILINE,
              ):
                  raise SystemExit(
                      f"Missing required model: {cls}"
                  )

          if '__tablename__ = "mobile_operations"' not in models:
              raise SystemExit(
                  "MobileOperation must map to mobile_operations."
              )

          if '__tablename__ = "mobile_changes"' not in models:
              raise SystemExit(
                  "MobileChange must map to mobile_changes."
              )

          print("Mobile sync models: OK")

          # --------------------------------------------------------
          # Migration chain
          # --------------------------------------------------------
          versions = Path("migrations/versions")

          d4 = versions / (
              "d4f2c7a91e60_mobile_sync_infrastructure.py"
          )

          e71 = versions / (
              "e71c8b4f2d10_add_sale_client_operation_id.py"
          )

          merge = versions / "final_mobile_merge.py"
          security = versions / "oma20261004_mobile_session_security.py"
          canonical = versions / "oma20261006_final_merge.py"

          for required in (d4, e71, merge, security, canonical):
              if not required.exists():
                  raise SystemExit(
                      f"Required migration missing: {required}"
                  )

          d4_text = d4.read_text(encoding="utf-8")
          e71_text = e71.read_text(encoding="utf-8")
          merge_text = merge.read_text(encoding="utf-8")
          security_text = security.read_text(encoding="utf-8")

          if (
              'revision = "d4f2c7a91e60"' not in d4_text
              or
              'down_revision = "ca10b49cd246"' not in d4_text
          ):
              raise SystemExit(
                  "Unexpected d4 mobile migration chain."
              )

          if (
              'revision = "e71c8b4f2d10"' not in e71_text
              or
              'down_revision = "d4f2c7a91e60"' not in e71_text
          ):
              raise SystemExit(
                  "Unexpected e71 mobile migration chain."
              )

          if (
              'revision = "f7a1c9e4b210"' not in merge_text
              or
              "e71c8b4f2d10" not in merge_text
          ):
              raise SystemExit(
                  "Final mobile migration merge is invalid."
              )

          canonical_text = canonical.read_text(encoding="utf-8")

          if (
              'revision = "oma20261004"' not in security_text
              or
              'down_revision = "f7a1c9e4b210"' not in security_text
          ):
              raise SystemExit(
                  "Mobile security migration is invalid."
              )

          if (
              'revision = "oma20261006_final"' not in canonical_text
              or
              '"oma20261006_landed_cost", "oma20261005_chat_fix"' not in canonical_text
          ):
              raise SystemExit(
                  "Canonical Alembic merge migration is invalid."
              )

          print("Mobile migration chain: OK")

          # --------------------------------------------------------
          # Prevent old duplicate migration from returning
          # --------------------------------------------------------
          obsolete = versions / (
              "7f0f6f0c8a21_add_mobile_sync_tables.py"
          )

          if obsolete.exists():
              raise SystemExit(
                  "Obsolete duplicate mobile-sync migration detected.\n"
                  "Delete:\n"
                  "migrations/versions/"
                  "7f0f6f0c8a21_add_mobile_sync_tables.py"
              )

          print("No obsolete duplicate migration: OK")

          # --------------------------------------------------------
          # Flutter package checks
          # --------------------------------------------------------
          for dependency in (
              "local_auth: ^2.3.0",
              "image_picker: ^1.1.2",
              "record: ^5.2.1",
              "just_audio: ^0.9.46",
          ):
              if dependency not in pubspec:
                  raise SystemExit(
                      f"Required Flutter dependency missing: {dependency}"
                  )

          if "name: oma_mobile" not in pubspec:
              raise SystemExit(
                  "mobile/pubspec.yaml does not define oma_mobile."
              )

          # Accept any '>=3.x.y <4.0.0' constraint so bumping the SDK
          # floor in pubspec.yaml never breaks this preflight again.
          import re
          if not re.search(
              r"sdk:\s*['\"]>=3\.\d+\.\d+ <4\.0\.0['\"]",
              pubspec,
          ):
              raise SystemExit(
                  "Unexpected Dart SDK constraint."
              )

          if "image_data" not in models or "image_mimetype" not in models:
              raise SystemExit("Product photo model fields are missing.")

          if "audio_data" not in api or "audio_mimetype" not in api:
              raise SystemExit("Team chat audio API support is missing.")

          print("Flutter package and media configuration: OK")

          print("")
          print("Backend/mobile compatibility preflight: PASSED")
          PY

      # ------------------------------------------------------------
      # BACKEND REGRESSION TESTS
      # ------------------------------------------------------------
      - name: Run backend regression tests
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check -q -r requirements.txt -r requirements-dev.txt
          python3 -m pytest -q

      # ------------------------------------------------------------
      # 3. INSTALL FLUTTER
      # ------------------------------------------------------------
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      # ------------------------------------------------------------
      # 4. FLUTTER DEPENDENCIES
      # ------------------------------------------------------------
      - name: Get Flutter dependencies
        run: flutter pub get

      # ------------------------------------------------------------
      # 5. FORMAT + ANALYZE FLUTTER CODE
      # ------------------------------------------------------------
      - name: Format Dart code
        run: dart format lib

      - name: Analyze Flutter code
        # Current Flutter stable reports legacy deprecations as infos.
        # Keep real analyzer errors/warnings fatal without failing the APK build
        # solely because these non-blocking infos are present.
        run: flutter analyze --no-fatal-infos

      # ------------------------------------------------------------
      # 6. FLUTTER TESTS
      # ------------------------------------------------------------
      - name: Run Flutter tests when present
        shell: bash
        run: |
          set -euo pipefail

          if [ -d test ] && \
             find test -type f -name '*_test.dart' \
             -print -quit | grep -q .
          then
            flutter test
          else
            echo "No Dart tests found; skipping flutter test."
          fi

      # ------------------------------------------------------------
      # 7. CREATE ANDROID PROJECT
      # ------------------------------------------------------------
      - name: Create Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            echo "A complete Android Gradle project was not found."
            echo "Regenerating the Android platform scaffold..."

            # This workflow recreates Android-specific files on every build;
            # the app's Dart source and assets live outside this directory.
            # Remove an incomplete scaffold so Flutter cannot mistake it for
            # a valid platform project and skip generating the Gradle files.
            rm -rf android

            flutter create \
              --platforms=android \
              --org com.example \
              .
          else
            echo "Android Gradle project found."
          fi

          # Remove old Java activity if present.
          find android/app/src/main \
            -name 'MainActivity.java' \
            -delete || true

          # Remove old generated Kotlin packages (flutter create derives the
          # package from --org + project name, which is not our final ID).
          rm -rf android/app/src/main/kotlin/io
          rm -rf android/app/src/main/kotlin/com

          # Create our package.
          mkdir -p \
            android/app/src/main/kotlin/com/omagroup/salesapp

          cat > android/app/src/main/kotlin/com/omagroup/salesapp/MainActivity.kt <<'EOF'
          package com.omagroup.salesapp

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.media.AudioAttributes
          import android.os.Build
          import io.flutter.embedding.android.FlutterFragmentActivity

          class MainActivity : FlutterFragmentActivity() {
              override fun onCreate(savedInstanceState: android.os.Bundle?) {
                  super.onCreate(savedInstanceState)

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val audio = AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_NOTIFICATION)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
                          .build()

                      // Resolve raw sounds by name at runtime instead of via the
                      // generated R class: R lives in the Gradle namespace package,
                      // which is not guaranteed to match com.omagroup.salesapp.
                      val channels = listOf(
                          Triple("oma_scanner_v3", "Oma scanner", "scanner_beep"),
                          Triple("oma_arrival_sea_v3", "Sea shipment arrivals", "ship_horn"),
                          Triple("oma_arrival_air_v3", "Air shipment arrivals", "airport_arrival"),
                          Triple("oma_chat_v3", "Oma team chat", "chat_message"),
                      )

                      val manager = getSystemService(NotificationManager::class.java)
                      for ((id, name, soundName) in channels) {
                          val soundRes = resources.getIdentifier(soundName, "raw", packageName)
                          val channel = NotificationChannel(
                              id,
                              name,
                              NotificationManager.IMPORTANCE_HIGH
                          )
                          channel.enableVibration(true)
                          if (soundRes != 0) {
                              val uri = android.net.Uri.parse(
                                  "android.resource://" + packageName + "/" + soundRes
                              )
                              channel.setSound(uri, audio)
                          }
                          manager.createNotificationChannel(channel)
                      }
                  }
              }
          }
          EOF

          # --------------------------------------------------------
          # Force final Android package name (namespace + applicationId)
          # --------------------------------------------------------
          python3 - <<'PY'
          from pathlib import Path
          import re

          NEW_PACKAGE = "com.omagroup.salesapp"

          path = next(
              (
                  p for p in (
                      Path("android/app/build.gradle"),
                      Path("android/app/build.gradle.kts"),
                  )
                  if p.exists()
              ),
              None,
          )
          if path is None:
              raise SystemExit("android/app/build.gradle was not generated.")

          kts = path.suffix == ".kts"
          s = path.read_text(encoding="utf-8")

          for key in ("namespace", "applicationId"):
              pattern = re.compile(
                  r'(?m)^([ \t]*)' + key + r'(?:[ \t]*=[ \t]*|[ \t]+)["\'][^"\']*["\']'
              )
              replacement = (
                  (lambda m, k=key: f'{m.group(1)}{k} = "{NEW_PACKAGE}"')
                  if kts
                  else (lambda m, k=key: f'{m.group(1)}{k} "{NEW_PACKAGE}"')
              )
              s, count = pattern.subn(replacement, s)
              if count == 0:
                  raise SystemExit(f"Could not find {key} in {path}.")

          path.write_text(s, encoding="utf-8")

          # Any leftover references in the generated Android project.
          leftovers = [
              str(f)
              for f in Path("android").rglob("*")
              if f.is_file()
              and f.suffix in {".gradle", ".kts", ".xml", ".kt", ".java", ".properties"}
              and "com.example" in f.read_text(encoding="utf-8", errors="ignore")
          ]
          if leftovers:
              raise SystemExit(f"Old com.example package still referenced in: {leftovers}")

          print(f"Android package set to {NEW_PACKAGE}")
          PY

          # --------------------------------------------------------
          # Notification sounds + Android notification channels
          # --------------------------------------------------------
          python3 - <<'PY'
          from pathlib import Path
          import math
          import struct
          import wave

          raw = Path("android/app/src/main/res/raw")
          raw.mkdir(parents=True, exist_ok=True)

          custom = Path("assets/notifications")
          required = {
              "scanner_beep.wav": custom / "scanner_beep.wav",
              "ship_horn.wav": custom / "ship_horn.wav",
              "airport_arrival.wav": custom / "airport_arrival.wav",
              "chat_message.wav": custom / "chat_message.wav",
          }

          def tone(path, seconds, frequencies, amplitude=0.42, sample_rate=44100):
              frames = int(seconds * sample_rate)
              with wave.open(str(path), "wb") as out:
                  out.setnchannels(1)
                  out.setsampwidth(2)
                  out.setframerate(sample_rate)
                  data = bytearray()
                  for n in range(frames):
                      t = n / sample_rate
                      env = min(1.0, n / (sample_rate * 0.012))
                      env *= min(1.0, (frames - n) / (sample_rate * 0.035))
                      value = sum(math.sin(2 * math.pi * f * t) for f in frequencies)
                      value /= len(frequencies)
                      data.extend(struct.pack("<h", int(32767 * amplitude * env * value)))
                  out.writeframes(data)

          fallback = {
              "scanner_beep.wav": (0.18, (1850, 2400), 0.34),
              "ship_horn.wav": (0.72, (330, 392), 0.48),
              "airport_arrival.wav": (0.62, (523, 659, 784), 0.36),
              "chat_message.wav": (0.24, (880, 1175), 0.30),
          }

          import shutil
          custom.mkdir(parents=True, exist_ok=True)

          for filename, source in required.items():
              destination = raw / filename
              if source.is_file() and source.stat().st_size > 0:
                  shutil.copy2(source, destination)
                  print(f"Using custom notification sound: {source}")
              else:
                  seconds, frequencies, amplitude = fallback[filename]
                  tone(destination, seconds, frequencies, amplitude)
                  print(f"Generated fallback notification sound: {filename}")

          for filename in required:
              if not (raw / filename).is_file() or (raw / filename).stat().st_size == 0:
                  raise SystemExit(f"Missing notification sound: {filename}")
          PY

          # --------------------------------------------------------
          # Android permissions + app name
          # --------------------------------------------------------
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit(
                  "AndroidManifest.xml was not generated."
              )

          s = manifest.read_text(encoding="utf-8")

          if "android.permission.INTERNET" not in s:
              s = s.replace(
                  "<application",
                  (
                      '<uses-permission '
                      'android:name="android.permission.INTERNET" />\n'
                      '    <uses-permission '
                      'android:name='
                      '"android.permission.ACCESS_NETWORK_STATE" />\n'
                      '    <uses-permission '
                      'android:name='
                      '"android.permission.ACCESS_COARSE_LOCATION" />\n'
                      '    <uses-permission '
                      'android:name='
                      '"android.permission.ACCESS_FINE_LOCATION" />\n'
                      '    <uses-permission android:name="android.permission.USE_BIOMETRIC" />\n'
                      '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
                      "    <application"
                  ),
                  1,
              )

          # Android 13+ requires runtime notification permission.
          # Firebase requests it at runtime; declare it explicitly so the
          # generated release manifest contains the permission.
          if "android.permission.POST_NOTIFICATIONS" not in s:
              s = s.replace(
                  "<application",
                  (
                      '    <uses-permission '
                      'android:name="android.permission.POST_NOTIFICATIONS" />\n'
                      '    <uses-permission '
                      'android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n'
                      '    <application'
                  ),
                  1,
              )

          s = s.replace(
              'android:label="Flutter Demo"',
              'android:label="OmaSales Mobile"',
          )
          s = s.replace(
              'android:label="oma_mobile"',
              'android:label="OmaSales Mobile"',
          )

          # This is non-security branding metadata. It does NOT change the
          # applicationId or signing configuration, and therefore does not
          # affect update compatibility. Google Play uses the developer name
          # configured in Play Console; this metadata also makes the intended
          # developer identity explicit to APK/AAB inspectors.
          if "com.oma.developer_name" not in s:
              s = s.replace(
                  "</application>",
                  (
                      '        <meta-data '
                      'android:name="com.oma.developer_name" '
                      'android:value="Oma Technologies" />\n'
                      "    </application>"
                  ),
                  1,
              )
          s = s.replace(
              'android:label="mobile"',
              'android:label="OmaSales Mobile"',
          )

          manifest.write_text(
              s,
              encoding="utf-8",
          )

          print("Android project prepared.")
          PY

      # ------------------------------------------------------------
      # 7a. CONFIGURE FIREBASE ANDROID SDK
      #
      # The Android project is generated during CI, so google-services.json
      # and the Google Services Gradle plugin must be installed here on every
      # build. The JSON is supplied through a GitHub Actions secret and is
      # never committed to the repository.
      # ------------------------------------------------------------
      - name: Configure Firebase Android SDK
        working-directory: mobile
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${FIREBASE_GOOGLE_SERVICES_JSON:-}" ]; then
            echo "ERROR: Missing GitHub Actions secret: FIREBASE_GOOGLE_SERVICES_JSON"
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          raw = os.environ["FIREBASE_GOOGLE_SERVICES_JSON"].strip()
          if not raw:
              raise SystemExit("FIREBASE_GOOGLE_SERVICES_JSON is empty.")

          try:
              config = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(
                  f"FIREBASE_GOOGLE_SERVICES_JSON is not valid JSON: {exc}"
              )

          expected_package = "com.omagroup.salesapp"
          clients = config.get("client") or []
          matching = [
              client for client in clients
              if (
                  client.get("client_info", {})
                  .get("android_client_info", {})
                  .get("package_name")
                  == expected_package
              )
          ]

          if not matching:
              raise SystemExit(
                  "google-services.json does not contain the registered "
                  f"Android package {expected_package}."
              )

          project_id = config.get("project_info", {}).get("project_id")
          if project_id != "omasales-5208e":
              raise SystemExit(
                  "google-services.json belongs to a different Firebase "
                  f"project. Expected omasales-5208, found {project_id!r}."
              )

          google_services = Path("android/app/google-services.json")
          google_services.write_text(
              raw + "\n",
              encoding="utf-8",
          )

          if google_services.stat().st_size == 0:
              raise SystemExit("Failed to write android/app/google-services.json.")

          # Flutter 3.24.5 generates Groovy Gradle files. Keep this logic
          # compatible with Kotlin DSL too so a future Flutter template change
          # does not silently remove Firebase support.
          settings_candidates = (
              Path("android/settings.gradle"),
              Path("android/settings.gradle.kts"),
          )
          app_candidates = (
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          )

          settings = next((p for p in settings_candidates if p.exists()), None)
          app_gradle = next((p for p in app_candidates if p.exists()), None)

          if settings is None:
              raise SystemExit("Could not find Android settings.gradle(.kts).")
          if app_gradle is None:
              raise SystemExit("Could not find Android app/build.gradle(.kts).")

          settings_text = settings.read_text(encoding="utf-8")
          app_text = app_gradle.read_text(encoding="utf-8")

          plugin_id = 'id "com.google.gms.google-services" version "4.5.0" apply false'
          if plugin_id not in settings_text:
              plugins_match = re.search(
                  r"(?m)^plugins\s*\{",
                  settings_text,
              )
              if not plugins_match:
                  raise SystemExit(
                      f"Could not find plugins {{ block in {settings}."
                  )
              settings_text = (
                  settings_text[:plugins_match.end()]
                  + "\n    "
                  + plugin_id
                  + settings_text[plugins_match.end():]
              )

          app_plugin = 'id "com.google.gms.google-services"'
          if app_plugin not in app_text:
              plugins_match = re.search(
                  r"(?m)^plugins\s*\{",
                  app_text,
              )
              if not plugins_match:
                  raise SystemExit(
                      f"Could not find plugins {{ block in {app_gradle}."
                  )
              app_text = (
                  app_text[:plugins_match.end()]
                  + "\n    "
                  + app_plugin
                  + app_text[plugins_match.end():]
              )

          settings.write_text(settings_text, encoding="utf-8")
          app_gradle.write_text(app_text, encoding="utf-8")

          # Final checks prevent a partially configured Firebase build.
          final_settings = settings.read_text(encoding="utf-8")
          final_app = app_gradle.read_text(encoding="utf-8")

          if (
              'com.google.gms.google-services" version "4.5.0" apply false'
              not in final_settings
          ):
              raise SystemExit("Google Services 4.5.0 plugin was not added to project Gradle.")

          if 'id "com.google.gms.google-services"' not in final_app:
              raise SystemExit("Google Services plugin was not applied to the Android app module.")

          print("Firebase Android configuration: OK")
          print(f"Firebase project: {project_id}")
          print(f"Android package: {expected_package}")
          print("google-services.json installed without committing it to the repository.")
          PY

      # ------------------------------------------------------------
      # 7b. FORCE minSdk 23
      #
      # firebase_messaging (and its Firebase Android SDK deps) require
      # minSdk 23. The generated project defaults to flutter.minSdkVersion
      # (21 on Flutter 3.24), which fails manifest merging, so pin it here.
      # ------------------------------------------------------------
      - name: Force Android minSdk 23
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          MIN_SDK = 23

          path = next(
              (
                  p for p in (
                      Path("android/app/build.gradle"),
                      Path("android/app/build.gradle.kts"),
                  )
                  if p.exists()
              ),
              None,
          )

          if path is None:
              raise SystemExit("android/app/build.gradle was not generated.")

          kts = path.suffix == ".kts"
          new_value = (
              f"minSdk = {MIN_SDK}" if kts else f"minSdkVersion {MIN_SDK}"
          )

          s = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r"(?m)^([ \t]*)minSdk(?:Version)?(?:[ \t]*=[ \t]*|[ \t]+)\S.*$"
          )

          if pattern.search(s):
              s = pattern.sub(lambda m: m.group(1) + new_value, s)
          else:
              default_config = re.search(
                  r"(?m)^([ \t]*)defaultConfig\s*\{[ \t]*$",
                  s,
              )
              if not default_config:
                  raise SystemExit("Could not locate defaultConfig { block.")
              indent = default_config.group(1) + "    "
              s = (
                  s[:default_config.end()]
                  + "\n" + indent + new_value
                  + s[default_config.end():]
              )

          path.write_text(s, encoding="utf-8")

          check = path.read_text(encoding="utf-8")
          if not re.search(
              rf"(?m)^[ \t]*minSdk(?:Version)?(?:[ \t]*=[ \t]*|[ \t]+){MIN_SDK}[ \t]*$",
              check,
          ):
              raise SystemExit("minSdk was not set to 23.")

          print(f"minSdk forced to {MIN_SDK} in {path}.")
          PY

      # ------------------------------------------------------------
      # 8. INSTALL JAVA
      # ------------------------------------------------------------
      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ------------------------------------------------------------
      # 9. GENERATE LAUNCHER ICON (adaptive icon: background + foreground,
      #    driven entirely by the flutter_launcher_icons config in
      #    pubspec.yaml — no hand-rolled masking here. This replaces the
      #    previous manual Pillow script, which baked a rounded shape onto
      #    a transparent legacy icon and reproduced the black-background
      #    bug on launchers that do not composite legacy icon transparency
      #    correctly.)
      # ------------------------------------------------------------
      - name: Generate launcher icon
        shell: bash
        run: |
          set -euo pipefail
          dart run flutter_launcher_icons
          echo "Launcher icon generated from pubspec.yaml adaptive icon config."

      # ------------------------------------------------------------
      # 10. CONFIGURE ANDROID SIGNING
      # ------------------------------------------------------------
      - name: Configure and validate Android release signing
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

        shell: bash

        run: |
          set -euo pipefail

          # --------------------------------------------------------
          # Check secrets
          # --------------------------------------------------------
          for required in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!required}" ]; then
              echo "Missing GitHub Actions secret: $required"
              exit 1
            fi
          done

          # --------------------------------------------------------
          # Decode keystore
          # --------------------------------------------------------
          printf '%s' \
            "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode \
            > android/app/oma-release.jks

          test -s android/app/oma-release.jks

          # --------------------------------------------------------
          # Create key.properties
          # --------------------------------------------------------
          python3 - <<'PY'
          import os
          from pathlib import Path

          values = {
              "storePassword":
                  os.environ["ANDROID_KEYSTORE_PASSWORD"],

              "keyPassword":
                  os.environ["ANDROID_KEY_PASSWORD"],

              "keyAlias":
                  os.environ["ANDROID_KEY_ALIAS"],

              "storeFile":
                  "oma-release.jks",
          }

          Path(
              "android/key.properties"
          ).write_text(
              "".join(
                  f"{key}={value}\n"
                  for key, value in values.items()
              ),
              encoding="utf-8",
          )
          PY

          # --------------------------------------------------------
          # Verify keystore + alias
          # --------------------------------------------------------
          keytool \
            -list \
            -keystore android/app/oma-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null

          echo "Android keystore validated."

          # --------------------------------------------------------
          # --------------------------------------------------------
          # Configure Gradle release signing (Groovy + Kotlin DSL)
          # --------------------------------------------------------
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = (
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          )
          path = next((p for p in candidates if p.is_file()), None)
          if path is None:
              raise SystemExit(
                  "Android app Gradle file is missing "
                  "(expected build.gradle or build.gradle.kts)."
              )

          s = path.read_text(encoding="utf-8")
          is_kts = path.suffix == ".kts"

          if is_kts:
              loader = """import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          """
              if "keystorePropertiesFile" not in s:
                  android_match = re.search(r"(?m)^android\s*\{", s)
                  if not android_match:
                      raise SystemExit(f"Could not locate android {{ block in {path}.")
                  s = s[:android_match.start()] + loader + s[android_match.start():]

              android_match = re.search(r"(?m)^android\s*\{", s)
              if not android_match:
                  raise SystemExit(f"Could not locate android {{ block in {path}.")

              if 'create("release")' not in s and "getByName(\"release\")" not in s:
                  signing = """    signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = keystoreProperties["storeFile"]?.let { file(it as String) }
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

          """
                  build_types = re.search(r"(?m)^([ \t]*)buildTypes\s*\{", s)
                  if not build_types:
                      raise SystemExit(f"Could not locate buildTypes {{ block in {path}.")
                  s = s[:build_types.start()] + signing + s[build_types.start():]

              build_types = re.search(r"(?m)^([ \t]*)buildTypes\s*\{", s)
              if not build_types:
                  raise SystemExit(f"Could not locate buildTypes {{ block in {path}.")
              tail = s[build_types.end():]
              release = re.search(r"(?m)^([ \t]*)getByName\(\"release\"\)\s*\{|^([ \t]*)release\s*\{", tail)
              if not release:
                  raise SystemExit(f"Could not locate release build type in {path}.")
              indent = release.group(1) or release.group(2) or "        "
              release_abs = build_types.end() + release.end()
              release_indent = indent
              close = re.search(r"(?m)^" + re.escape(release_indent) + r"\}", s[release_abs:])
              if not close:
                  raise SystemExit(f"Could not locate release block end in {path}.")
              block = s[release_abs:release_abs + close.start()]
              block = re.sub(r"(?m)^[ \t]*signingConfig\s*=.*(?:\n|$)", "", block)
              block = "\n" + release_indent + "    signingConfig = signingConfigs.getByName(\"release\")" + block
              s = s[:release_abs] + block + s[release_abs + close.start():]

              if "signingConfigs.getByName(\"release\")" not in s:
                  raise SystemExit("Kotlin DSL release signing was not configured.")
          else:
              if "keystorePropertiesFile" not in s:
                  android_match = re.search(r"(?m)^android\s*\{", s)
                  if not android_match:
                      raise SystemExit(f"Could not locate android {{ block in {path}.")
                  prefix = (
                      "def keystoreProperties = new Properties()\n"
                      "def keystorePropertiesFile = rootProject.file('key.properties')\n"
                      "if (keystorePropertiesFile.exists()) {\n"
                      "    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n"
                      "}\n\n"
                  )
                  s = s[:android_match.start()] + prefix + s[android_match.start():]

              build_types = re.search(r"(?m)^([ \t]*)buildTypes\s*\{", s)
              if not build_types:
                  raise SystemExit(f"Could not locate buildTypes {{ block in {path}.")
              if "signingConfigs {" not in s:
                  indent = build_types.group(1)
                  signing = (
                      f"{indent}signingConfigs {{\n"
                      f"{indent}    release {{\n"
                      f"{indent}        keyAlias keystoreProperties['keyAlias']\n"
                      f"{indent}        keyPassword keystoreProperties['keyPassword']\n"
                      f"{indent}        storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null\n"
                      f"{indent}        storePassword keystoreProperties['storePassword']\n"
                      f"{indent}    }}\n{indent}}}\n\n"
                  )
                  s = s[:build_types.start()] + signing + s[build_types.start():]

              build_types = re.search(r"(?m)^([ \t]*)buildTypes\s*\{", s)
              tail = s[build_types.end():]
              release = re.search(r"(?m)^([ \t]*)release\s*\{", tail)
              if not release:
                  raise SystemExit(f"Could not locate release block in {path}.")
              release_abs = build_types.end() + release.end()
              release_indent = release.group(1)
              close = re.search(r"(?m)^" + re.escape(release_indent) + r"\}", s[release_abs:])
              if not close:
                  raise SystemExit(f"Could not locate release block end in {path}.")
              block = s[release_abs:release_abs + close.start()]
              signing_line = release_indent + "    signingConfig signingConfigs.release"
              block = re.sub(r"(?m)^[ \t]*signingConfig(?:[ \t]*=[ \t]*)?[ \t]+signingConfigs\.[A-Za-z0-9_]+[ \t]*(?:\n|$)", "", block)
              block = "\n" + signing_line + block
              s = s[:release_abs] + block + s[release_abs + close.start():]
              if "signingConfig signingConfigs.release" not in s:
                  raise SystemExit("Groovy release signing was not configured.")

          path.write_text(s, encoding="utf-8")
          print(f"Android release signing configured in {path}.")
          PY

          echo "Android release signing configuration: OK"

      - name: Build signed APK and AAB
        env:
          API_URL: ${{ github.event.inputs.api_url || 'https://oma-db.onrender.com/api' }}
          FCM_API_KEY: ${{ secrets.FCM_API_KEY }}
          FCM_APP_ID: ${{ secrets.FCM_APP_ID }}
          FCM_MESSAGING_SENDER_ID: ${{ secrets.FCM_MESSAGING_SENDER_ID }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_AUTH_DOMAIN: ${{ secrets.FCM_AUTH_DOMAIN }}
          FCM_STORAGE_BUCKET: ${{ secrets.FCM_STORAGE_BUCKET }}
          FCM_WEB_VAPID_KEY: ${{ secrets.FCM_WEB_VAPID_KEY }}

        shell: bash

        run: |
          set -euo pipefail

          echo "Using API:"
          echo "$API_URL"

          # Firebase/FCM is required for release notification support.
          # Fail early instead of producing an APK that silently lacks push
          # registration or Firebase initialization data.
          for required in \
            FCM_API_KEY \
            FCM_APP_ID \
            FCM_MESSAGING_SENDER_ID \
            FCM_PROJECT_ID
          do
            if [ -z "${!required}" ]; then
              echo "ERROR: Missing GitHub Actions secret: $required"
              exit 1
            fi
          done

          echo "Firebase/FCM build configuration: OK"

          # Release builds must use HTTPS.
          case "$API_URL" in
            https://*)
              ;;
            *)
              echo "ERROR: API_URL must use HTTPS."
              echo "Received: $API_URL"
              exit 1
              ;;
          esac

          echo "Building release APK..."

          flutter build apk \
            --release \
            --build-number="${{ github.run_number }}" \
            --dart-define=API_BASE_URL="$API_URL" \
            --dart-define=FCM_API_KEY="$FCM_API_KEY" \
            --dart-define=FCM_APP_ID="$FCM_APP_ID" \
            --dart-define=FCM_MESSAGING_SENDER_ID="$FCM_MESSAGING_SENDER_ID" \
            --dart-define=FCM_PROJECT_ID="$FCM_PROJECT_ID" \
            --dart-define=FCM_AUTH_DOMAIN="$FCM_AUTH_DOMAIN" \
            --dart-define=FCM_STORAGE_BUCKET="$FCM_STORAGE_BUCKET" \
            --dart-define=FCM_WEB_VAPID_KEY="$FCM_WEB_VAPID_KEY"

          echo "Building release AAB..."

          flutter build appbundle \
            --release \
            --build-number="${{ github.run_number }}" \
            --dart-define=API_BASE_URL="$API_URL" \
            --dart-define=FCM_API_KEY="$FCM_API_KEY" \
            --dart-define=FCM_APP_ID="$FCM_APP_ID" \
            --dart-define=FCM_MESSAGING_SENDER_ID="$FCM_MESSAGING_SENDER_ID" \
            --dart-define=FCM_PROJECT_ID="$FCM_PROJECT_ID" \
            --dart-define=FCM_AUTH_DOMAIN="$FCM_AUTH_DOMAIN" \
            --dart-define=FCM_STORAGE_BUCKET="$FCM_STORAGE_BUCKET" \
            --dart-define=FCM_WEB_VAPID_KEY="$FCM_WEB_VAPID_KEY"

          # --------------------------------------------------------
          # Verify artifacts
          # --------------------------------------------------------
          test -s \
            build/app/outputs/flutter-apk/app-release.apk

          test -s \
            build/app/outputs/bundle/release/app-release.aab

          echo ""
          echo "=========================================="
          echo "BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "APK:"
          echo "build/app/outputs/flutter-apk/app-release.apk"
          echo ""
          echo "AAB:"
          echo "build/app/outputs/bundle/release/app-release.aab"

      # ------------------------------------------------------------
      # 11a. RENAME BUILD OUTPUTS
      #
      # Flutter always names its output app-release.apk/.aab, which is
      # what Android's installer and file managers display. Copy them to
      # a branded name so the file shows as the app name instead. This
      # only renames the file; applicationId and signing are unchanged.
      # ------------------------------------------------------------
      - name: Rename build outputs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/named

          cp build/app/outputs/flutter-apk/app-release.apk \
            build/named/OmaSales-Mobile.apk

          cp build/app/outputs/bundle/release/app-release.aab \
            build/named/OmaSales-Mobile.aab

          test -s build/named/OmaSales-Mobile.apk
          test -s build/named/OmaSales-Mobile.aab

      # ------------------------------------------------------------
      # 12. UPLOAD APK
      # ------------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: OmaSales-APK-${{ github.run_number }}
          if-no-files-found: error
          path: mobile/build/named/OmaSales-Mobile.apk

      # ------------------------------------------------------------
      # 13. UPLOAD AAB
      # ------------------------------------------------------------
      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: OmaSales-AAB-${{ github.run_number }}
          if-no-files-found: error
          path: mobile/build/named/OmaSales-Mobile.aab
