name: Build Oma Mobile APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: Backend API base URL
        required: true
        default: https://oma-db.onrender.com/api
        type: string

permissions:
  contents: read

concurrency:
  group: oma-mobile-apk
  cancel-in-progress: false

jobs:
  build:
    name: Build signed OmaSales APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout main
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true

      - name: Install locked Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Oma launcher icons from repository artwork
        run: dart run flutter_launcher_icons

      - name: Configure Firebase and release signing
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("FIREBASE_GOOGLE_SERVICES_JSON", "").strip()
          if not raw:
              raise SystemExit("Missing FIREBASE_GOOGLE_SERVICES_JSON secret.")
          try:
              config = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"Firebase JSON is invalid: {exc}")
          if config.get("project_info", {}).get("project_id") != "omasales-5208e":
              raise SystemExit("Firebase config is not for the OmaSales project.")
          clients = config.get("client", [])
          if not any(
              item.get("client_info", {}).get("android_client_info", {}).get("package_name")
              == "com.omagroup.salesapp"
              for item in clients
          ):
              raise SystemExit("Firebase config has no com.omagroup.salesapp Android client.")
          Path("android/app/google-services.json").write_text(raw + "\n", encoding="utf-8")

          required = (
              "ANDROID_KEYSTORE_BASE64",
              "ANDROID_KEYSTORE_PASSWORD",
              "ANDROID_KEY_ALIAS",
              "ANDROID_KEY_PASSWORD",
          )
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing Android signing secrets: " + ", ".join(missing))

          import base64
          try:
              keystore = base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True)
          except Exception as exc:
              raise SystemExit(f"ANDROID_KEYSTORE_BASE64 is invalid: {exc}")
          if not keystore:
              raise SystemExit("Decoded Android keystore is empty.")
          Path("android/app/oma-release.jks").write_bytes(keystore)
          Path("android/key.properties").write_text(
              "storePassword=" + os.environ["ANDROID_KEYSTORE_PASSWORD"] + "\n" +
              "keyPassword=" + os.environ["ANDROID_KEY_PASSWORD"] + "\n" +
              "keyAlias=" + os.environ["ANDROID_KEY_ALIAS"] + "\n" +
              "storeFile=oma-release.jks\n",
              encoding="utf-8",
          )
          PY
          keytool -list \
            -keystore android/app/oma-release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        env:
          API_URL: ${{ inputs.api_url }}
          FCM_API_KEY: ${{ secrets.FCM_API_KEY }}
          FCM_APP_ID: ${{ secrets.FCM_APP_ID }}
          FCM_MESSAGING_SENDER_ID: ${{ secrets.FCM_MESSAGING_SENDER_ID }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_AUTH_DOMAIN: ${{ secrets.FCM_AUTH_DOMAIN }}
          FCM_STORAGE_BUCKET: ${{ secrets.FCM_STORAGE_BUCKET }}
          FCM_WEB_VAPID_KEY: ${{ secrets.FCM_WEB_VAPID_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          case "$API_URL" in
            https://*) ;;
            *) echo "API URL must start with https://"; exit 1 ;;
          esac
          for key in FCM_API_KEY FCM_APP_ID FCM_MESSAGING_SENDER_ID FCM_PROJECT_ID; do
            if [ -z "${!key:-}" ]; then
              echo "Missing GitHub Actions secret: $key"
              exit 1
            fi
          done

          flutter build apk --release --build-number="$GITHUB_RUN_NUMBER" \
            --dart-define=API_BASE_URL="$API_URL" \
            --dart-define=FCM_API_KEY="$FCM_API_KEY" \
            --dart-define=FCM_APP_ID="$FCM_APP_ID" \
            --dart-define=FCM_MESSAGING_SENDER_ID="$FCM_MESSAGING_SENDER_ID" \
            --dart-define=FCM_PROJECT_ID="$FCM_PROJECT_ID" \
            --dart-define=FCM_AUTH_DOMAIN="$FCM_AUTH_DOMAIN" \
            --dart-define=FCM_STORAGE_BUCKET="$FCM_STORAGE_BUCKET" \
            --dart-define=FCM_WEB_VAPID_KEY="$FCM_WEB_VAPID_KEY"

          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          mkdir -p build/named
          cp "$APK" build/named/OmaSales-Mobile.apk
          sha256sum build/named/OmaSales-Mobile.apk | tee build/named/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: OmaSales-APK-${{ github.run_number }}
          path: |
            mobile/build/named/OmaSales-Mobile.apk
            mobile/build/named/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: success()
        working-directory: .
        shell: bash
        run: |
          {
            echo "## OmaSales APK build completed"
            echo
            echo "- Branch: `$GITHUB_REF_NAME`"
            echo "- Build number: `$GITHUB_RUN_NUMBER`"
            echo "- Artifact: `OmaSales-APK-$GITHUB_RUN_NUMBER`"
            echo "- APK: `OmaSales-Mobile.apk`"
            echo
            echo "Download the APK from this workflow run's Artifacts section."
          } >> "$GITHUB_STEP_SUMMARY"
