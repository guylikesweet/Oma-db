name: Build OmaSales Mobile

on:
  push:
    paths:
      - 'app/**'
      - 'mobile/**'
      - 'migrations/**'
      - 'requirements.txt'
      - '.github/workflows/build-oma-apk.yml'
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend URL'
        required: true
        default: 'https://oma-db.onrender.com/api'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Backend and mobile preflight
        working-directory: .
        run: |
          python3 -m compileall -q app
          python3 - <<'PY'
          from pathlib import Path
          api = Path('app/api.py').read_text()
          models = Path('app/models.py').read_text()
          required_routes = [
            '/v1/auth/login','/v1/auth/change-password','/v1/bootstrap','/v1/sync',
            '/v1/products','/v1/stock/adjust','/v1/sales','/v1/batches',
            '/v1/deliveries','/v1/shipping','/v1/rates/courier','/v1/rates/monthly',
            '/v1/dashboard','/v1/reports/sales','/v1/reports/shipping','/v1/reports/inventory',
            '/v1/settings','/v1/settings/logo','/v1/users','/v1/clear-test-data'
          ]
          missing=[r for r in required_routes if r not in api]
          if missing: raise SystemExit('Missing API routes: '+', '.join(missing))
          for cls in ('MobileOperation','MobileChange'):
            if f'class {cls}' not in models: raise SystemExit(f'Missing model: {cls}')
          versions=list(Path('migrations/versions').glob('*.py'))
          if any('7f0f6f0c8a21_add_mobile_sync_tables' in p.name for p in versions):
            raise SystemExit('Obsolete duplicate mobile-sync migration detected; remove it.')
          print('Preflight OK')
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.0'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: flutter pub get
      - run: flutter analyze

      - name: Create Android project
        run: |
          if [ ! -d android ]; then flutter create --platforms=android .; fi
          rm -rf android/app/src/main/java/io
          mkdir -p android/app/src/main/kotlin/com/example/oma_mobile
          cat > android/app/src/main/kotlin/com/example/oma_mobile/MainActivity.kt <<'EOF'
          package com.example.oma_mobile
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity: FlutterActivity()
          EOF
          find android/app/src/main -name 'MainActivity.java' -delete || true
          sed -i 's/android:label="[^"]*"/android:label="OmaSales Mobile"/' android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml; then
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <application#' android/app/src/main/AndroidManifest.xml
          fi

      - name: Validate and install launcher icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct

          src = Path('assets/images/app_icon.png')
          if not src.exists():
              raise SystemExit('assets/images/app_icon.png is missing')

          data = src.read_bytes()
          png_signature = b'\x89PNG\r\n\x1a\n'
          if not data.startswith(png_signature):
              raise SystemExit('assets/images/app_icon.png is not a valid PNG file')
          if len(data) < 24 or data[12:16] != b'IHDR':
              raise SystemExit('assets/images/app_icon.png has no valid PNG header')

          width, height = struct.unpack('>II', data[16:24])
          if width <= 0 or height <= 0:
              raise SystemExit('assets/images/app_icon.png has invalid dimensions')

          res = Path('android/app/src/main/res')
          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          for folder in sizes:
              out = res / folder
              out.mkdir(parents=True, exist_ok=True)
              # Keep the supplied verified PNG unchanged. Android accepts a
              # valid PNG in each density bucket; no Pillow/ImageMagick needed.
              (out / 'launcher_icon.png').write_bytes(data)
              (out / 'ic_launcher.png').write_bytes(data)

          print(f'Icon OK: {width}x{height}')
          PY

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo 'Missing Android release signing secrets.'; exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/oma-release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=oma-release.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          if 'keystorePropertiesFile' not in s:
            s=s.replace('android {', """def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          
          android {""",1)
          if 'signingConfigs {' not in s:
            s=s.replace('buildTypes {', """signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
          
              buildTypes {""",1)
          if 'signingConfig signingConfigs.release' not in s:
            s=s.replace('buildTypes {
                  release {', 'buildTypes {
                  release {
                      signingConfig signingConfigs.release',1)
          p.write_text(s)
          PY

      - name: Build signed APK and AAB
        env:
          API_URL: ${{ github.event.inputs.api_url || 'https://oma-db.onrender.com/api' }}
        run: |
          flutter build apk --release --dart-define=API_BASE_URL="$API_URL"
          flutter build appbundle --release --dart-define=API_BASE_URL="$API_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: OmaSales-Mobile-${{ github.run_number }}
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
