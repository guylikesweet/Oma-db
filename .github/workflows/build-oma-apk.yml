name: Build Oma Mobile APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API URL - use https://oma-db.onrender.com/api'
        required: true
        default: 'https://oma-db.onrender.com/api'
        type: string

jobs:
  build-apk:
    name: Analyze and build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Fix Gradle project
        working-directory: ./mobile
        run: |
          rm -rf android test
          echo "include: package:flutter_lints/flutter.yaml" > analysis_options.yaml
          echo "linter:" >> analysis_options.yaml
          echo "  rules:" >> analysis_options.yaml
          echo "    avoid_print: false" >> analysis_options.yaml
          flutter create --platforms=android --org com.oma --project-name oma_mobile .
          rm -rf test
          flutter pub add flutter_lints --dev
          flutter pub get
      - name: Analyze code
        working-directory: ./mobile
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build Release APK
        working-directory: ./mobile
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ inputs.api_base_url }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: oma-mobile-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
