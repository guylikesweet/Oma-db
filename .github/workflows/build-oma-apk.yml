name: Build APK
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Your real Render URL e.g https://your-backend.onrender.com/api'
        required: true
        default: 'https://oma-sales.onrender.com/api'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.0'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install Pillow

      - run: flutter pub get

      - name: Create android and fix everything
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi
          rm -rf android/app/src/main/java/io
          mkdir -p android/app/src/main/kotlin/com/example/oma_mobile
          echo 'package com.example.oma_mobile
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity: FlutterActivity()' > android/app/src/main/kotlin/com/example/oma_mobile/MainActivity.kt
          find android/app/src/main -name "MainActivity.java" -delete || true
          sed -i 's/android:label=".*"/android:label="OmaSales Mobile"/' android/app/src/main/AndroidManifest.xml
          python3 << 'PY'
          from PIL import Image, ImageDraw
          import os
          src="assets/images/app_icon.png"
          if not os.path.exists(src):
              im=Image.new("RGBA",(512,512),(255,255,255,255)); d=ImageDraw.Draw(im); d.rounded_rectangle([50,50,462,462],radius=80,fill=(79,70,229)); im.save(src)
          im=Image.open(src).convert("RGBA")
          s=max(im.size); bg=Image.new("RGBA",(s,s),(255,255,255,255)); bg.paste(im,((s-im.width)//2,(s-im.height)//2),im)
          for f,p in {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}.items():
              path=f"android/app/src/main/res/{f}"; os.makedirs(path,exist_ok=True)
              r=bg.resize((p,p),Image.LANCZOS); r.save(f"{path}/launcher_icon.png","PNG"); r.save(f"{path}/ic_launcher.png","PNG")
          PY

      - run: flutter build apk --release --dart-define=API_BASE_URL="${{ inputs.api_url }}"

      - uses: actions/upload-artifact@v4
        with:
          name: OmaSales-Mobile-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
