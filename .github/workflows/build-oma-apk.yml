name: Build APK

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'API URL (e.g. https://your-app.onrender.com/api)'
        required: true
        default: 'https://your-app.onrender.com/api'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.22.0'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pillow
        run: pip install Pillow
          
      - name: Install dependencies
        run: flutter pub get

      - name: Upgrade dependencies to fix v1 embedding
        run: flutter pub upgrade --major-versions

      - name: Fix API config name
        run: |
          if [ -f lib/core/config.dart ]; then
            sed -i 's/OMA_API_BASE_URL/API_BASE_URL/g' lib/core/config.dart || true
          fi
          if [ -f lib/data/config.dart ]; then
            sed -i 's/OMA_API_BASE_URL/API_BASE_URL/g' lib/data/config.dart || true
          fi
          if [ -f lib/config.dart ]; then
            sed -i 's/OMA_API_BASE_URL/API_BASE_URL/g' lib/config.dart || true
          fi
          if [ -f lib/core/config/app_config.dart ]; then
            sed -i 's/OMA_API_BASE_URL/API_BASE_URL/g' lib/core/config/app_config.dart || true
          fi

      - name: Generate launcher icons from Oma logo
        run: |
          ls -lh assets/images/ || echo "no images folder"
          python3 << 'PY'
          from PIL import Image
          import os
          src = "assets/images/app_icon.png"
          fallback = "assets/images/logo.png"
          img_path = None
          for p in [src, fallback]:
              if os.path.exists(p):
                  try:
                      with Image.open(p) as im:
                          im.load()
                      img_path = p
                      print(f"Using {p}")
                      break
                  except Exception as e:
                      print(f"{p} invalid: {e}")
          if not img_path:
              print("Generating fallback icon")
              from PIL import ImageDraw
              im = Image.new("RGBA", (512, 512), (255,255,255,255))
              draw = ImageDraw.Draw(im)
              draw.rounded_rectangle([50,50,462,462], radius=80, fill=(79,70,229))
              try:
                  draw.text((256,256), "Oma", anchor="mm", fill="white")
              except:
                  draw.text((200,230), "Oma", fill="white")
              im.save("assets/images/app_icon.png")
              img_path = "assets/images/app_icon.png"
          else:
              im = Image.open(img_path).convert("RGBA")
          size = max(im.size)
          bg = Image.new("RGBA", (size, size), (255,255,255,255))
          bg.paste(im, ((size-im.width)//2, (size-im.height)//2), im)
          for folder, px in {"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}.items():
              path = f"android/app/src/main/res/{folder}"
              os.makedirs(path, exist_ok=True)
              resized = bg.resize((px, px), Image.LANCZOS)
              resized.save(f"{path}/launcher_icon.png", "PNG")
              resized.save(f"{path}/ic_launcher.png", "PNG")
              print(f"Generated {path}/ic_launcher.png")
          PY

      - name: Change app name to OmaSales Mobile
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:label="[^"]*"/android:label="OmaSales Mobile"/g' $MANIFEST
            grep -n "android:label" $MANIFEST
          fi

      - name: Ensure Android v2 embedding
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "flutterEmbedding" "$MANIFEST"; then
            sed -i '/<application/a \        <meta-data android:name="flutterEmbedding" android:value="2" />' $MANIFEST
          fi
          cat $MANIFEST | grep -A2 -B2 flutterEmbedding || true

      - name: Build APK
        run: flutter build apk --release --dart-define=API_BASE_URL="${{ inputs.api_url }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OmaSales-Mobile-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
