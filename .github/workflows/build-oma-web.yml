name: Build OmaSales Web

on:
  # Automatic runs are intentionally disabled.
  # Start this workflow manually from the Actions tab.
  workflow_dispatch:

  push:
    paths:
      - 'app/**'
      - 'mobile/**'
      - 'migrations/**'
      - 'requirements.txt'
      - '.github/workflows/build-oma-web.yml'

  workflow_dispatch:
    inputs:
      api_url:
        description: 'Backend API base URL'
        required: true
        default: 'https://oma-db.onrender.com/api'

permissions:
  contents: read

concurrency:
  group: oma-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    defaults:
      run:
        working-directory: mobile

    steps:

      # ------------------------------------------------------------
      # 1. CHECKOUT
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # ------------------------------------------------------------
      # 2. INSTALL FLUTTER
      # ------------------------------------------------------------
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      # ------------------------------------------------------------
      # 3. FLUTTER DEPENDENCIES
      # ------------------------------------------------------------
      - name: Get Flutter dependencies
        run: flutter pub get

      # ------------------------------------------------------------
      # 4. CREATE WEB PROJECT
      # (mirrors "Create Android project" in build-oma-apk.yml — the
      # web/ platform folder is generated fresh on every run rather
      # than committed to the repo.)
      # ------------------------------------------------------------
      - name: Create Flutter web project
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d web ]; then
            echo "Web project does not exist."
            echo "Creating web project..."

            flutter create \
              --platforms=web \
              --org com.example \
              .
          else
            echo "Web project already exists."
          fi

          python3 - <<'PY'
          from pathlib import Path

          index = Path("web/index.html")
          if not index.exists():
              raise SystemExit("web/index.html was not generated.")

          s = index.read_text(encoding="utf-8")
          s = s.replace(
              "<title>mobile</title>",
              "<title>OmaSales</title>",
          )
          index.write_text(s, encoding="utf-8")

          print("Web project prepared.")
          PY

      # ------------------------------------------------------------
      # 4b. SQLITE WEB BINARIES
      #
      # sqflite has no browser implementation, so the app uses
      # sqflite_common_ffi_web (IndexedDB-backed) on web instead — see
      # databaseFactoryFfiWeb in main.dart. That factory needs a wasm
      # SQLite build and a shared-worker JS file inside web/, generated
      # by this package's own setup command (not something we hand-write).
      # ------------------------------------------------------------
      - name: Install sqflite web binaries
        shell: bash
        run: dart run sqflite_common_ffi_web:setup

      # ------------------------------------------------------------
      # 5. BUILD (release)
      #
      # --base-href /webapp/ : this build is served by Flask under the
      # /webapp/ prefix (see app/webapp.py) — a deliberately separate,
      # non-default path so this can be tested on the real production
      # domain without touching the existing site at "/". Once that's
      # confirmed working, promoting it to the actual homepage is a
      # separate, later decision — not automatic just because this
      # build succeeds.
      # ------------------------------------------------------------
      - name: Configure Firebase web messaging worker
        env:
          FCM_API_KEY: ${{ secrets.FCM_API_KEY }}
          FCM_APP_ID: ${{ secrets.FCM_APP_ID }}
          FCM_MESSAGING_SENDER_ID: ${{ secrets.FCM_MESSAGING_SENDER_ID }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_AUTH_DOMAIN: ${{ secrets.FCM_AUTH_DOMAIN }}
          FCM_STORAGE_BUCKET: ${{ secrets.FCM_STORAGE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          # working-directory is already "mobile", so the path is web/,
          # not mobile/web/ (that resolved to mobile/mobile/web).
          mkdir -p web
          cat > web/firebase-messaging-sw.js <<EOF
          importScripts("https://www.gstatic.com/firebasejs/11.6.1/firebase-app-compat.js");
          importScripts("https://www.gstatic.com/firebasejs/11.6.1/firebase-messaging-compat.js");

          firebase.initializeApp({
            apiKey: "${FCM_API_KEY}",
            authDomain: "${FCM_AUTH_DOMAIN}",
            projectId: "${FCM_PROJECT_ID}",
            storageBucket: "${FCM_STORAGE_BUCKET}",
            messagingSenderId: "${FCM_MESSAGING_SENDER_ID}",
            appId: "${FCM_APP_ID}"
          });
          firebase.messaging();
          EOF
      - name: Build web (release)
        env:
          API_URL: ${{ github.event.inputs.api_url || 'https://oma-db.onrender.com/api' }}
          FCM_API_KEY: ${{ secrets.FCM_API_KEY }}
          FCM_APP_ID: ${{ secrets.FCM_APP_ID }}
          FCM_MESSAGING_SENDER_ID: ${{ secrets.FCM_MESSAGING_SENDER_ID }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_AUTH_DOMAIN: ${{ secrets.FCM_AUTH_DOMAIN }}
          FCM_STORAGE_BUCKET: ${{ secrets.FCM_STORAGE_BUCKET }}
          FCM_WEB_VAPID_KEY: ${{ secrets.FCM_WEB_VAPID_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build web --release --base-href /webapp/ \
            --dart-define=API_BASE_URL="$API_URL" \
            --dart-define=FCM_API_KEY="$FCM_API_KEY" \
            --dart-define=FCM_APP_ID="$FCM_APP_ID" \
            --dart-define=FCM_MESSAGING_SENDER_ID="$FCM_MESSAGING_SENDER_ID" \
            --dart-define=FCM_PROJECT_ID="$FCM_PROJECT_ID" \
            --dart-define=FCM_AUTH_DOMAIN="$FCM_AUTH_DOMAIN" \
            --dart-define=FCM_STORAGE_BUCKET="$FCM_STORAGE_BUCKET" \
            --dart-define=FCM_WEB_VAPID_KEY="$FCM_WEB_VAPID_KEY"
          # Flutter Web routes unknown paths to index.html itself, but
          # GitHub Pages needs an explicit 404.html to do the same —
          # otherwise a page refresh on any route but "/" 404s.
          cp build/web/index.html build/web/404.html

      # ------------------------------------------------------------
      # 6. UPLOAD BUILD ARTIFACT (downloadable zip, as before)
      # ------------------------------------------------------------
      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: OmaSales-Web-${{ github.run_number }}
          if-no-files-found: error
          path: mobile/build/web

      # ------------------------------------------------------------
      # 7. UPLOAD FOR GITHUB PAGES
      #
      # This is a TESTING convenience only — a stable, phone-friendly
      # URL to click through the build on, since a downloaded zip can't
      # be served locally from a phone. This is not the production
      # hosting decision (step 10 in our plan); that may end up being
      # this, Render, or somewhere else entirely.
      # ------------------------------------------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: mobile/build/web

      # ------------------------------------------------------------
      # 8. COMMIT COMPILED WEB APP BACK INTO THE REPO
      #
      # Render auto-deploys on every push to this repo, but its build
      # is plain Python — it can't run Flutter itself. So instead: this
      # job builds it here, then commits the compiled output into
      # app/static/webapp/, which Render then picks up and deploys like
      # any other file change, no separate hosting service involved.
      #
      # "[skip ci]" is essential — without it, this commit would match
      # this workflow's own "app/**" trigger and re-run itself forever.
      # ------------------------------------------------------------
      - name: Commit compiled web app
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$GITHUB_WORKSPACE/app/static/webapp"
          mkdir -p "$GITHUB_WORKSPACE/app/static/webapp"
          cp -r build/web/. "$GITHUB_WORKSPACE/app/static/webapp/"

          cd "$GITHUB_WORKSPACE"

          # A previous web-build job may have finished just before this job
          # reached the push step and advanced the branch with compiled output.
          # Refresh first so this job never fails merely because that generated
          # commit won the race.
          git fetch origin "$GITHUB_REF_NAME"
          git reset --hard "origin/$GITHUB_REF_NAME"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf "$GITHUB_WORKSPACE/app/static/webapp"
          mkdir -p "$GITHUB_WORKSPACE/app/static/webapp"
          cp -r "$GITHUB_WORKSPACE/mobile/build/web/." "$GITHUB_WORKSPACE/app/static/webapp/"
          git add app/static/webapp

          if git diff --cached --quiet; then
            echo "No changes to the compiled web app — nothing to commit."
          else
            git commit -m "chore: update compiled web app [skip ci]"
            for attempt in 1 2 3; do
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Unable to push compiled web app after 3 attempts."
                exit 1
              fi
              git fetch origin "$GITHUB_REF_NAME"
              git reset --hard "origin/$GITHUB_REF_NAME"
              rm -rf "$GITHUB_WORKSPACE/app/static/webapp"
              mkdir -p "$GITHUB_WORKSPACE/app/static/webapp"
              cp -r "$GITHUB_WORKSPACE/mobile/build/web/." "$GITHUB_WORKSPACE/app/static/webapp/"
              git add app/static/webapp
              git diff --cached --quiet || git commit -m "chore: update compiled web app [skip ci]" || true
              sleep 2
            done
          fi

  deploy-preview:
    needs: build
    runs-on: ubuntu-24.04
    # The GitHub Pages copy is only a convenience preview. If Pages isn't
    # enabled for the repo (Settings > Pages > Source: GitHub Actions) this
    # job 404s - that must not mark the real build (which commits the web
    # app that Render serves) as failed.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
