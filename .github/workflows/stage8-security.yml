name: Stage 8 Security Guard

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "config.py"
      - "tests/**"
      - ".github/workflows/stage8-security.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "config.py"
      - "tests/**"
      - ".github/workflows/stage8-security.yml"
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile backend
        run: python -m compileall -q app

      - name: Run backend tests
        run: pytest -q

      - name: Verify production security configuration
        env:
          DATABASE_URL: postgresql://security-test.invalid/db
        run: |
          python - <<'PY'
          import os
          os.environ.pop("SECRET_KEY", None)
          os.environ["DATABASE_URL"] = "postgresql://security-test.invalid/db"
          try:
              import config
              raise SystemExit("Config accepted production DATABASE_URL without SECRET_KEY")
          except RuntimeError as exc:
              if "SECRET_KEY" not in str(exc):
                  raise
          print("Production SECRET_KEY fail-closed guard verified.")
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: mobile
        run: flutter analyze

      - name: Run architecture tests
        working-directory: mobile
        run: flutter test test/architecture_layers_test.dart
