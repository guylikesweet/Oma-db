services:
  - type: web
    name: logistics-app
    env: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt && flask db upgrade oma20261006_final && flask db current && flask db heads
    startCommand: "gunicorn run:app"
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_APP
        value: run.py
      - key: SECRET_KEY
        sync: false          # set manually in Render dashboard — do not commit real value
      - key: DATABASE_URL
        sync: false          # your Neon connection string — set manually in Render dashboard
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false          # used by the manual flask seed-admin command
