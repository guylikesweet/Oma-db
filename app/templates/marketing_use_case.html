<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ item.seo_title }} | OmaSales</title><meta name="description" content="{{ item.description }}"><meta name="robots" content="index,follow">
<link rel="canonical" href="{{ canonical_url }}"><link rel="icon" href="{{ url_for('static', filename='logo.png') }}"><meta property="og:type" content="website"><meta property="og:title" content="{{ item.seo_title }} | OmaSales"><meta property="og:description" content="{{ item.description }}"><meta property="og:url" content="{{ canonical_url }}"><meta property="og:image" content="{{ og_image }}"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="{{ item.seo_title }} | OmaSales"><meta name="twitter:description" content="{{ item.description }}"><meta name="twitter:image" content="{{ og_image }}"> <link rel="preload" as="image" href="{{ url_for('static', filename='logo.png') }}" fetchpriority="high">
<style>:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#13251f}body{margin:0}.wrap{max-width:900px;margin:auto;padding:0 22px}.nav{height:72px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;text-decoration:none}.brand img{display:block;width:46px;height:46px;object-fit:contain}.cta{background:#039664;color:#fff;padding:13px 19px;border-radius:10px;text-decoration:none;font-weight:800}.hero{padding:75px 0;background:#f1fbf7}h1{font-size:clamp(38px,6vw,60px);line-height:1.04;letter-spacing:-.04em}p,li{font-size:18px;line-height:1.7;color:#5b6b66}.box{padding:24px;border:1px solid #e0e9e5;border-radius:16px;margin:20px 0}.back{display:inline-block;margin-top:35px;color:#087b55;font-weight:800;text-decoration:none}</style>
<script type="application/ld+json">{{ schema|tojson }}</script></head><body><header class="wrap nav"><a class="brand" href="/" aria-label="OmaSales home"><img src="{{ url_for('static', filename='logo.png') }}" alt="OmaSales" width="46" height="46" loading="eager" decoding="async"></a><a class="cta" href="/webapp/">Open OmaSales</a></header>
<main><section class="hero"><div class="wrap"><h1>{{ item.headline }}</h1><p>{{ item.description }}</p><a class="cta" href="/webapp/">Start using OmaSales</a></div></section><section class="wrap"><div class="box"><h2>Why {{ item.name|lower }} businesses use OmaSales</h2><ul>{% for point in item.points %}<li>{{ point }}</li>{% endfor %}</ul></div><p>{{ item.body }}</p><a class="back" href="/">← Back to OmaSales</a></section></main></body></html>
