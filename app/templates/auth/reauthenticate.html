{% extends 'base_standalone.html' %}
{% block title %}Verify Password{% endblock %}
{% block body %}
<div class="container" style="max-width:460px;margin-top:48px;">
  <div class="card">
    <h2>Verify password</h2>
    <form method="post">
      <input type="hidden" name="next" value="{{ next_url }}">
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" class="form-control" autocomplete="current-password" required autofocus>
      </div>
      <button type="submit" class="btn btn-primary">Verify</button>
    </form>
  </div>
</div>
{% endblock %}
