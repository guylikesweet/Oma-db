<button type="button" id="omaClassicChatFab" class="oma-chat-fab" aria-label="Open team chat">
  <span>💬</span><b>Team chat</b>
</button>

<div id="omaClassicChatPanel" class="oma-chat-panel" aria-hidden="true">
  <div class="oma-chat-head">
    <div>
      <strong>Team chat</strong>
      <small>Shared with the mobile app and web app</small>
    </div>
    <button type="button" id="omaClassicChatClose" aria-label="Close">&times;</button>
  </div>
  <div id="omaClassicChatMessages" class="oma-chat-messages">
    <div class="oma-chat-state">Loading…</div>
  </div>
  <div id="omaClassicChatReply" class="oma-chat-reply" hidden></div>
  <div class="oma-chat-compose-wrap">
    <div id="omaClassicChatMentions" class="oma-chat-mentions" hidden></div>
    <div id="omaClassicChatProfile" class="oma-chat-profile-sheet" hidden></div>
    <div class="oma-chat-compose">
    <label class="oma-chat-photo" title="Attach photo">
      📎
      <input id="omaClassicChatPhoto" type="file" accept="image/*" hidden>
    </label>
    <input id="omaClassicChatInput" type="text" maxlength="4000" placeholder="Write a message…">
    <button type="button" id="omaClassicChatSend">Send</button>
    </div>
  </div>
</div>

<style>
.oma-chat-fab{position:fixed;right:22px;bottom:92px;z-index:1200;border:0;border-radius:999px;background:linear-gradient(135deg,#039664,#027a52);color:#fff;padding:12px 18px;display:flex;gap:8px;align-items:center;font-weight:800;box-shadow:0 10px 28px rgba(0,0,0,.22);cursor:pointer}
.oma-chat-panel{position:fixed;right:22px;bottom:150px;width:min(430px,calc(100vw - 28px));height:min(650px,calc(100vh - 110px));z-index:1201;background:var(--oma-surface,#fff);color:var(--oma-text,#212529);border:1px solid var(--oma-border,#e2e2e2);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:none;overflow:hidden}
.oma-chat-panel.open{display:flex;flex-direction:column}
.oma-chat-head{display:flex;justify-content:space-between;align-items:center;padding:15px 17px;background:#039664;color:#fff}
.oma-chat-head strong{display:block;font-size:16px}.oma-chat-head small{display:block;opacity:.82;font-size:11px;margin-top:2px}
.oma-chat-head button{border:0;background:transparent;color:#fff;font-size:27px;cursor:pointer}
.oma-chat-messages{flex:1;overflow:auto;padding:14px;background:var(--oma-bg,#f4f5f7)}
.oma-chat-msg.target-message{outline:2px solid #039664;box-shadow:0 0 0 4px rgba(3,150,100,.14)}
.oma-chat-pending{opacity:.72}.oma-chat-msg{position:relative;max-width:86%;margin:0 0 22px;padding:7px 9px 6px;border-radius:13px;background:var(--oma-surface,#fff);border:1px solid var(--oma-border,#e2e2e2);line-height:1.28}.oma-chat-msg.mine{margin-left:auto;background:#e8f6f0;border-color:#b8e3d2}.oma-chat-name{font-size:10px;font-weight:800;color:#039664;margin-bottom:2px}.oma-chat-time{font-size:8px;color:var(--oma-muted,#666);margin-top:3px}.oma-chat-body{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.oma-chat-attachment{margin-top:5px}.oma-chat-attachment img{display:block;max-width:min(280px,100%);max-height:260px;border-radius:10px;object-fit:cover;cursor:pointer}.oma-chat-body .mention{font-weight:800;color:#039664}.oma-chat-reply-preview{border-left:3px solid #039664;padding-left:6px;margin-bottom:4px;font-size:10px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.oma-chat-reactions{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.oma-chat-reaction{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border:1px solid var(--oma-border,#d9e2de);border-radius:999px;background:var(--oma-bg,#f5f8f7);color:inherit;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:15px;line-height:20px;cursor:pointer}.oma-chat-reaction-count{font-family:inherit;font-size:10px;font-weight:800;color:var(--oma-muted,#666)}.oma-chat-reaction:hover{background:#e8f6f0;border-color:#9ed5c2}.oma-chat-reaction-picker{display:flex;gap:3px;padding:5px;border:1px solid var(--oma-border,#ddd);border-radius:999px;background:var(--oma-surface,#fff);box-shadow:0 8px 20px rgba(0,0,0,.14);position:absolute;right:7px;bottom:25px;z-index:6}.oma-chat-reaction-picker button{border:0;background:transparent;border-radius:50%;width:30px;height:30px;padding:0;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:20px;line-height:30px;cursor:pointer}.oma-chat-reaction-picker button:hover{background:var(--oma-bg,#f4f5f7)}
.oma-chat-menu-button{position:absolute;right:8px;bottom:-20px;width:22px;height:18px;padding:0;border:0;border-radius:6px;background:transparent;color:var(--oma-muted,#777);font-size:15px;line-height:18px;cursor:pointer;opacity:.65}.oma-chat-menu-button:hover{opacity:1;background:var(--oma-bg,#f4f5f7)}.oma-chat-menu{position:absolute;right:7px;bottom:-2px;z-index:5;min-width:105px;padding:4px;background:var(--oma-surface,#fff);border:1px solid var(--oma-border,#ddd);border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,.16)}.oma-chat-menu button{display:block;width:100%;padding:7px 8px;border:0;border-radius:6px;background:transparent;color:inherit;text-align:left;font-size:11px;cursor:pointer}.oma-chat-menu button:hover{background:var(--oma-bg,#f4f5f7)}.oma-chat-state{text-align:center;color:var(--oma-muted,#666);padding:25px 10px}.oma-chat-compose-wrap{position:relative;border-top:1px solid var(--oma-border,#e2e2e2);background:var(--oma-surface,#fff)}.oma-chat-mentions{position:absolute;left:8px;right:8px;bottom:58px;z-index:10;max-height:220px;overflow:auto;padding:4px;background:var(--oma-surface,#fff);border:1px solid var(--oma-border,#ddd);border-radius:11px;box-shadow:0 10px 28px rgba(0,0,0,.18)}.oma-chat-mention{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border:0;border-radius:8px;background:transparent;color:inherit;text-align:left;cursor:pointer}.oma-chat-mention:hover,.oma-chat-mention:focus{background:var(--oma-bg,#f4f5f7);outline:0}.oma-chat-avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:0 0 30px;background:#dce9e4;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#28745b;overflow:hidden}.oma-chat-mention-link{border:0;background:transparent;color:#039664;font-weight:800;padding:0;cursor:pointer;font:inherit}.oma-chat-profile-sheet{position:fixed;inset:0;z-index:1300;padding:24px;background:var(--oma-surface,#fff);border:0;border-radius:0;box-shadow:0 20px 60px rgba(0,0,0,.28);display:flex;align-items:flex-start;gap:16px;overflow:auto}.oma-chat-profile-sheet[hidden]{display:none}.oma-chat-profile-sheet .oma-chat-avatar{width:48px;height:48px;flex-basis:48px;font-size:16px}.oma-chat-profile-close{margin-left:auto;border:0;background:transparent;color:inherit;font-size:20px;cursor:pointer}.oma-chat-mention-name{font-size:12px;font-weight:800}.oma-chat-mention-sub{font-size:9px;color:var(--oma-muted,#777);margin-top:1px}.oma-chat-compose{display:flex;gap:6px;padding:8px}.oma-chat-compose input[type=text]{flex:1;min-width:0;height:38px;padding:0 10px}.oma-chat-photo{display:flex;align-items:center;justify-content:center;width:38px;border:1px solid var(--oma-border,#e2e2e2);border-radius:9px;cursor:pointer}.oma-chat-compose button{border:0;border-radius:9px;padding:0 13px;background:#039664;color:#fff;font-weight:800;cursor:pointer}.oma-chat-compose button:disabled{opacity:.55;cursor:wait}
@media(max-width:600px){.oma-chat-fab{right:12px;bottom:82px}.oma-chat-panel{right:0;bottom:0;width:100vw;height:100dvh;max-height:none;border-radius:0;border-left:0;border-right:0;border-bottom:0}}
</style>

<script>
window.omaClassicChatUserId = {{ current_user.id|tojson }};
(function(){
  'use strict';
  var fab=document.getElementById('omaClassicChatFab');
  var panel=document.getElementById('omaClassicChatPanel');
  if(!fab||!panel)return;
  var close=document.getElementById('omaClassicChatClose');
  var profileSheet=document.getElementById('omaClassicChatProfile');
  var list=document.getElementById('omaClassicChatMessages');
  var input=document.getElementById('omaClassicChatInput');
  var send=document.getElementById('omaClassicChatSend');
  var photo=document.getElementById('omaClassicChatPhoto');
  var replyBox=document.getElementById('omaClassicChatReply');
  var mentionBox=document.getElementById('omaClassicChatMentions');
  var csrf='';
  var replyTo=null;
  var messages=[];
  var pendingMessages=[];
  var users=[];
  var mentionOptions=[];
  var targetMessageId=new URLSearchParams(window.location.search).get('chat_message_id');

  function esc(s){return String(s??'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function initials(name){var s=String(name||'?').trim();return s?s.slice(0,1).toUpperCase():'?'}
  function lagosTime(raw){try{var value=String(raw||'').trim();if(!value)return '';if(!/[Zz]|[+-]\d{2}:?\d{2}$/.test(value))value+='Z';var d=new Date(value);if(Number.isNaN(d.getTime()))return value.replace('T',' ').split('.')[0];var lagos=new Date(d.getTime()+60*60*1000);function two(n){return String(n).padStart(2,'0')}return two(lagos.getUTCDate())+'/'+two(lagos.getUTCMonth()+1)+'/'+lagos.getUTCFullYear()+' '+two(lagos.getUTCHours())+':'+two(lagos.getUTCMinutes())}catch(e){return String(raw||'').replace('T',' ').split('.')[0]}}
  function avatar(user){if(user&&user.profile_photo_url)return '<img class="oma-chat-avatar" src="'+esc(user.profile_photo_url)+'" alt="" onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{className:\'oma-chat-avatar\',textContent:\''+initials(user.username)+'\'}))">';return '<span class="oma-chat-avatar">'+initials(user&&user.username)+'</span>'}
  function mentionUser(username){return users.find(function(u){return String(u.username||'').toLowerCase()===String(username||'').toLowerCase()})||null}
  function renderBody(text){
    var safe=esc(text||'');
    return safe.replace(/(^|[\s])@([A-Za-z0-9_.-]{1,50})/g,function(_,prefix,username){
      var user=mentionUser(username);
      if(!user)return prefix+'@'+username;
      return prefix+'<button type="button" class="oma-chat-mention-link" data-mention-user="'+esc(user.id)+'">@'+esc(username)+'</button>';
    });
  }
  function showMentionProfile(user){
    if(!profileSheet||!user)return;
    profileSheet.innerHTML=avatar(user)+'<div><strong>@'+esc(user.username||'User')+'</strong><div class="oma-chat-mention-sub">'+(user.is_admin?'Administrator':'Team member')+'</div></div><button type="button" class="oma-chat-profile-close" aria-label="Close">×</button>';
    profileSheet.hidden=false;
  }
  function hideMentionProfile(){if(profileSheet)profileSheet.hidden=true}
  function openChat(){panel.classList.add('open');panel.setAttribute('aria-hidden','false');loadUsers();load()}
  function closeChat(){panel.classList.remove('open');panel.setAttribute('aria-hidden','true');hideMentions()}
  function hideMentions(){mentionOptions=[];mentionBox.hidden=true;mentionBox.innerHTML=''}
  function mentionMatch(){var cursor=input.selectionStart;if(cursor==null)cursor=input.value.length;return input.value.slice(0,cursor).match(/(^|\s)@([A-Za-z0-9_.-]*)$/)}
  function onMentionInput(){var match=mentionMatch();if(!match||!users.length){hideMentions();return}var q=(match[2]||'').toLowerCase();mentionOptions=users.filter(function(u){return u.is_active!==false&&u.id!==window.omaClassicChatUserId&&String(u.username||'').toLowerCase().indexOf(q)===0}).slice(0,8);if(!mentionOptions.length){hideMentions();return}mentionBox.innerHTML=mentionOptions.map(function(u,i){return '<button type="button" class="oma-chat-mention" data-mention-index="'+i+'">'+avatar(u)+'<span><span class="oma-chat-mention-name">@'+esc(u.username)+'</span><span class="oma-chat-mention-sub">Team member</span></span></button>'}).join('');mentionBox.hidden=false}
  function selectMention(user){var cursor=input.selectionStart;if(cursor==null)cursor=input.value.length;var match=mentionMatch();if(!match)return;var start=match.index+(match[1]||'').length;var replacement='@'+user.username+' ';input.value=input.value.slice(0,start)+replacement+input.value.slice(cursor);var next=start+replacement.length;input.focus();input.setSelectionRange(next,next);hideMentions();onMentionInput()}
  async function loadUsers(){try{users=await api('/classic/chat/users');onMentionInput()}catch(e){users=[];hideMentions()}}
  async function initCsrf(){if(csrf)return;var r=await fetch('/classic/chat/csrf',{headers:{Accept:'application/json'}});var d=await r.json();csrf=d.token||''}
  async function api(path,opts){
    opts=opts||{};opts.headers=Object.assign({'Accept':'application/json'},opts.headers||{});
    if(opts.body&&!opts.headers['Content-Type'])opts.headers['Content-Type']='application/json';
    if(opts.method&&opts.method!=='GET')opts.headers['X-Oma-Chat-CSRF']=csrf;
    var r=await fetch(path,opts);var d=await r.json().catch(function(){return {error:'Unexpected server response.'}});
    if(!r.ok)throw new Error(d.error||('HTTP '+r.status)+(d.diagnostic?' — '+d.diagnostic:''));return d
  }
  function render(){
    if(!messages.length){list.innerHTML='<div class="oma-chat-state">No messages yet. Start the conversation.</div>';return}
    var wasNearBottom=list.scrollHeight-list.scrollTop-list.clientHeight<80;
    var visibleMessages=messages.concat(pendingMessages);
    if(!visibleMessages.length){list.innerHTML='<div class="oma-chat-state">No messages yet. Start the conversation.</div>';return}
    list.innerHTML=visibleMessages.map(function(m){
      var mine=m.sender_user_id===window.omaClassicChatUserId;
      var deleted=m.deleted;
      var body=deleted?'Message deleted':renderBody(m.content||'');
      var reply=m.reply_to?'<div class="oma-chat-reply-preview">↪ '+esc(m.reply_to.content||'Message deleted')+'</div>':'';
      var photo=m.attachment_url?'<div class="oma-chat-attachment"><img src="'+esc(m.attachment_url)+'" alt="Chat photo" loading="lazy" onclick="window.open(this.src,\'_blank\')"></div>':'';
      var canManage=mine||{{ 'true' if current_user.is_admin else 'false' }};
      var hasText=String(m.content||'').trim().length>0;
      var reactions=m.reactions||{};
      var reactionHtml=Object.keys(reactions).length?'<div class="oma-chat-reactions">'+Object.keys(reactions).map(function(e){return '<button type="button" class="oma-chat-reaction" data-reaction="'+esc(e)+'" title="React with '+esc(e)+'"><span>'+esc(e)+'</span><span class="oma-chat-reaction-count">'+esc(reactions[e])+'</span></button>'}).join('')+'</div>':'';
      return '<div class="oma-chat-msg '+(mine?'mine ':'')+(m._pending?' oma-chat-pending':'')+(targetMessageId&&String(m.id)===String(targetMessageId)?'target-message':'')+'" data-id="'+esc(m.id)+'">'+
        '<div class="oma-chat-name">'+esc(m.sender_username||'Team member')+'</div>'+reply+
        '<div class="oma-chat-body">'+body+(m.edited?' <small>(edited)</small>':'')+'</div>'+photo+reactionHtml+
        '<div class="oma-chat-time">'+(m._pending?'Sending…':(m.created_at?lagosTime(m.created_at):''))+'</div>'+
        '<button type="button" class="oma-chat-menu-button" aria-label="Message actions">⋯</button>'+
        '<div class="oma-chat-menu" hidden>'+
        '<button type="button" data-act="reply">Reply</button><button type="button" data-act="react">👍 React</button>'+
        '<div class="oma-chat-reaction-picker" hidden><button type="button" data-emoji="👍">👍</button><button type="button" data-emoji="❤️">❤️</button><button type="button" data-emoji="😂">😂</button><button type="button" data-emoji="😮">😮</button><button type="button" data-emoji="😢">😢</button><button type="button" data-emoji="🔥">🔥</button></div>'+
        (hasText?'<button type="button" data-act="copy">Copy</button>':'')+
        (m.attachment_url?'<button type="button" data-act="save">Save photo</button>':'')+
        (canManage&&!deleted?'<button type="button" data-act="edit">Edit</button><button type="button" data-act="delete">Delete</button>':'')+
        '</div></div>'
    }).join('');
    if(wasNearBottom||list.scrollTop===0)list.scrollTop=list.scrollHeight
  }
  function focusTargetMessage(){
    if(!targetMessageId)return false;
    var row=list.querySelector('.oma-chat-msg[data-id="'+CSS.escape(String(targetMessageId))+'"]');
    if(!row)return false;
    row.scrollIntoView({behavior:'smooth',block:'center'});
    row.classList.add('target-message');
    window.setTimeout(function(){if(row)row.classList.remove('target-message')},4500);
    return true;
  }
  async function loadTargetMessage(){
    if(!targetMessageId)return;
    if(focusTargetMessage())return;
    var id=Number(targetMessageId);
    if(!Number.isInteger(id)||id<1)return;
    try{
      var target=await api('/classic/chat/messages/'+encodeURIComponent(id));
      if(target){
        messages=messages.concat([target]).filter(function(m,i,a){return a.findIndex(function(x){return String(x.id)===String(m.id)})===i}).sort(function(a,b){return Number(a.id)-Number(b.id)});
        render();
        focusTargetMessage();
      }
    }catch(e){}
  }
  async function load(){
    try{await initCsrf();messages=await api('/classic/chat/messages?limit=100');render();await loadTargetMessage()}catch(e){list.innerHTML='<div class="oma-chat-state">'+esc(e.message)+'</div>'}
  }
  async function sendMessage(){
    var text=input.value.trim();var file=photo.files[0];
    if(!text&&!file)return;
    var localId='local-'+Date.now()+'-'+Math.random().toString(36).slice(2);
    var local={id:localId,sender_user_id:window.omaClassicChatUserId,sender_username:'You',content:text,created_at:new Date().toISOString(),reply_to:replyTo,_pending:true};
    pendingMessages.push(local);
    input.value='';photo.value='';replyTo=null;replyBox.hidden=true;replyBox.textContent='';
    render();list.scrollTop=list.scrollHeight;
    try{
      var payload={content:text,reply_to_id:local.reply_to?local.reply_to.id:null};
      if(file){
        if(file.size>12*1024*1024)throw new Error('Photo is too large. Maximum is 12 MB.');
        payload.attachment_filename=file.name;
        payload.attachment_base64=await new Promise(function(resolve,reject){
          var fr=new FileReader();fr.onload=function(){resolve(String(fr.result).split(',')[1]||'')};fr.onerror=reject;fr.readAsDataURL(file)
        });
      }
      await api('/classic/chat/messages',{method:'POST',body:JSON.stringify(payload)});
      pendingMessages=pendingMessages.filter(function(m){return m.id!==localId});
      await load();
    }catch(e){
      pendingMessages=pendingMessages.filter(function(m){return m.id!==localId});
      render();alert(e.message);
    }
  }
  list.addEventListener('click',async function(ev){
    var menuButton=ev.target.closest('.oma-chat-menu-button');
    if(menuButton){var row=menuButton.closest('.oma-chat-msg');var menu=row&&row.querySelector('.oma-chat-menu');if(menu){list.querySelectorAll('.oma-chat-menu').forEach(function(x){if(x!==menu)x.hidden=true});menu.hidden=!menu.hidden}return}
    var mention=ev.target.closest('.oma-chat-mention-link');
    if(mention){
      var mentioned=mentionUser(mention.getAttribute('data-mention-user')&&Number(mention.getAttribute('data-mention-user')));
      if(mentioned){showMentionProfile(mentioned);return}
    }
    if(ev.target.closest('.oma-chat-profile-close')){hideMentionProfile();return}
    var b=ev.target.closest('button[data-act]');if(!b)return;
    var row=b.closest('.oma-chat-msg');var id=row&&row.getAttribute('data-id');var m=messages.find(function(x){return String(x.id)===String(id)});if(!m)return;
    var act=b.getAttribute('data-act');
    try{
      if(act==='reply'){replyTo=m;replyBox.hidden=false;replyBox.textContent='Replying to '+(m.sender_username||'team member')+': '+(m.content||'Message deleted');input.focus();return}
      if(act==='delete'){if(!confirm('Delete this message?'))return;await api('/classic/chat/messages/'+id,{method:'DELETE'});await load();return}
      if(act==='edit'){var next=prompt('Edit message',m.content||'');if(next===null)return;await api('/classic/chat/messages/'+id,{method:'PATCH',body:JSON.stringify({content:next})});await load();return}
      if(act==='react'){await api('/classic/chat/messages/'+id+'/react',{method:'POST',body:JSON.stringify({emoji:'👍'})});await load();return}
      if(act==='copy'){await navigator.clipboard.writeText(m.content||'');return}
      if(act==='save'){if(m.attachment_url)window.open(m.attachment_url,'_blank');return}
    }catch(e){alert(e.message)}
  });
  list.addEventListener('click',async function(ev){
    var emojiButton=ev.target.closest('[data-emoji]');
    if(!emojiButton)return;
    var row=emojiButton.closest('.oma-chat-msg');var id=row&&row.getAttribute('data-id');
    try{
      await api('/classic/chat/messages/'+id+'/react',{method:'POST',body:JSON.stringify({emoji:emojiButton.getAttribute('data-emoji')})});
      await load();
    }catch(e){alert(e.message)}
  });
  mentionBox.addEventListener('click',function(ev){var b=ev.target.closest('[data-mention-index]');if(!b)return;var u=mentionOptions[Number(b.getAttribute('data-mention-index'))];if(u)selectMention(u)});
  fab.addEventListener('click',openChat);close.addEventListener('click',closeChat);send.addEventListener('click',sendMessage);
  input.addEventListener('input',onMentionInput);input.addEventListener('click',onMentionInput);input.addEventListener('keyup',onMentionInput);
  input.addEventListener('keydown',function(e){if(e.key==='Escape'){hideMentions();return}if(e.key==='Enter'&&!e.shiftKey&&!mentionBox.hidden&&mentionOptions.length){e.preventDefault();selectMention(mentionOptions[0]);return}if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
  window.setInterval(function(){if(panel.classList.contains('open'))load()},4000);
})();
</script>
