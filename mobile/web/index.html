<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="OmaSales — sales, stock and delivery management.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OmaSales">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OmaSales</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="oma-first-paint-loader" role="status" aria-live="polite">
    <div class="oma-first-paint-spinner"></div>
    <div class="oma-first-paint-text">Please wait</div>
  </div>
  <style>
    #oma-first-paint-loader{
      position:fixed;inset:0;z-index:2147483647;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:14px;background:#fff;color:#212529;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    }
    .oma-first-paint-spinner{
      width:46px;height:46px;border:4px solid #dfeee8;border-top-color:#039664;
      border-radius:50%;animation:oma-first-paint-spin .8s linear infinite;
    }
    .oma-first-paint-text{font-size:15px;font-weight:700}
    @keyframes oma-first-paint-spin{to{transform:rotate(360deg)}}
    html.oma-flutter-ready #oma-first-paint-loader{
      opacity:0;pointer-events:none;transition:opacity .16s ease;
    }
  </style>
  <script>
    window.addEventListener('flutter-first-frame', function(){
      document.documentElement.classList.add('oma-flutter-ready');
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('firebase-messaging-sw.js', {
          scope: '/webapp/firebase-cloud-messaging-push-scope'
        }).catch(function () {});
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
