name: oma_mobile
description: Offline-first mobile client for the Oma Flask application.
publish_to: 'none'
version: 0.3.0+30

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.0
  uuid: ^4.5.1
  image_picker: ^1.1.2
  share_plus: ^10.1.4
  sqflite_common_ffi_web: ^0.4.5+4
  printing: ^5.13.4

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  # Legacy/fallback icon (pre-Android 8 and any launcher that doesn't support
  # adaptive icons). Must be fully opaque — a transparent legacy icon is what
  # was causing the black background, since several launchers fill transparent
  # pixels on non-adaptive icons with black instead of leaving them clear.
  image_path: "assets/images/app_icon_legacy.png"
  # Adaptive icon (Android 8+): background + foreground are composited and
  # masked by the OS into whatever corner shape that device/launcher uses
  # (circle, squircle, rounded square...), so curvature is consistent with
  # every other icon on the phone instead of a custom baked-in radius.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: false
